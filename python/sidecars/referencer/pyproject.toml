# The VirtualiZarr referencer sidecar (ADR 0006, post-bake-off role): the
# CONFORMANCE REFERENCE and long-tail fallback for the production pure-Rust
# generator (crates/swath-referencer). legacy granule (NetCDF4/HDF5) ->
# virtual chunk manifest, independently derived; the equivalence harness
# (`just test-referencer`) is what keeps the two interchangeable.

[project]
name = "swath-referencer"
version = "0.0.0"
description = "Swath conformance-reference referencer: legacy granules to virtual chunk manifests via VirtualiZarr"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "virtualizarr>=2.0",
    "h5py>=3.12",
    "kerchunk>=0.2",
    "xarray>=2025.1",
    "numpy>=2",
]

[project.scripts]
# The conformance-reference CLI (ADR 0006): granule -> schema-v1 manifest
# via VirtualiZarr, independent of the production Rust generator.
swath-referencer = "swath_referencer.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "hypothesis>=6.130",
    "pyright>=1.1.400",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# The production home of the VirtualiZarr referencer sidecar (ADR 0006):
# legacy granule (NetCDF4/HDF5/GRIB2) -> virtual chunk manifest. Prototype 0001
# holds the bake-off harness; its requirements.txt migrates here as the
# dependency set below. Serve-time reading is pure Rust — this is ingest-only.

[project]
name = "swath-referencer"
version = "0.0.0"
description = "Swath ingest sidecar: legacy granules to virtual chunk manifests via VirtualiZarr"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "virtualizarr>=2.0",
    "h5py>=3.12",
    "kerchunk>=0.2",
    "xarray>=2025.1",
    "numpy>=2",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "hypothesis>=6.130",
    "pyright>=1.1.400",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Standalone package: prototypes are never workspace members (root Cargo.toml excludes them);
# the empty [workspace] table makes that explicit so cargo doesn't climb to the repo root.
[workspace]

[package]
name = "swath-referencer-bakeoff"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Prototype 0001: compare Python (VirtualiZarr) vs pure-Rust virtual-reference generation."

[[bin]]
name = "swath-referencer-bakeoff"
path = "src/main.rs"

# Deliberately ZERO external dependencies: the harness is std-only so it builds and runs anywhere,
# offline, with no supply chain. Format-specific generators are feature-gated; when implementing them,
# add the real crates here and enable in the matching feature:
#   grib  -> gribberish
#   hdf5  -> hdf5-metno
[dependencies]
gribberish = { version = "1.6", optional = true, default-features = false }
# `static` builds the bundled libhdf5 (no system HDF5 required); we only read metadata, so no
# zlib/filter decode support is needed.
hdf5-metno = { version = "0.14", optional = true, features = ["static"] }

[features]
default = []
grib = ["dep:gribberish"]
hdf5 = ["dep:hdf5-metno"]

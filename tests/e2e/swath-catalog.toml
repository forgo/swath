# Catalog-mode serve config for the compose stack (issue #31): pgstac-backed
# layers over the HLS demo dataset, with the filedrop ingest loop watching
# /data/drop. Mounted read-only into the swath container by
# docker-compose.yml; `just e2e` drops the fixture granule into the watched
# directory and measures ingest-to-pixel.
#
# The layer definitions mirror the built-in `--fixtures` demo registry
# (truecolor, ndvi) so a served tile stays byte-comparable to the committed
# goldens — but here their band assets resolve per tile from the dataset's
# latest ingested granule. Truecolor pins against the GDAL/rio-tiler
# golden; ndvi (RdYlGn-colormapped by default, issue #94) pins against the
# committed colormapped self-golden, with its values proven against the
# grayscale GDAL golden via the two-level scheme in `just e2e`.

bind = "0.0.0.0:8080"
base-url = "http://localhost:8080"
store-root = "/data"
# Write-through tile cache (#36): its own writable mount — the data
# plane at /data stays read-only. `just e2e` asserts the second fetch of
# a tile is a cache_hit; the north-star ingest-to-pixel number is always
# measured on the FIRST (uncached) fetch.
cache = "/cache"
catalog = "postgres://swath:swath-local-dev@pgstac:5432/swath"
watch-dir = "/data/drop"

[[datasets]]
id = "hls-s30"
title = "HLS Sentinel-2 (S30)"
description = "Harmonized Landsat Sentinel-2, S30 product."
license = "CC0-1.0"

[[datasets.layers]]
id = "truecolor"
title = "HLS true color"
description = "B04/B03/B02 composite, reflectance rescaled 0..3000."
kind = "truecolor"
rescale = [0.0, 3000.0]
[datasets.layers.bands]
r = "b04"
g = "b03"
b = "b02"

[[datasets.layers]]
id = "ndvi"
title = "HLS NDVI"
description = "(B8A - B04) / (B8A + B04), rescaled -1..1, RdYlGn colormap."
kind = "ndvi"
[datasets.layers.bands]
nir = "b8a"
red = "b04"

# The six-date Park Fire series (tests/fixtures/README.md, issue #179):
# the time-dimension e2e (ADR 0015, issue #180) drops all six granules
# via tests/e2e/drop-fire-granules.sh and steps `datetime=` across them.
# Grayscale so served frames compare against the committed rio-tiler
# oracle goldens (crates/swath-render/tests/data/fire-ndvi-*). The layer
# id deliberately sorts after "ndvi": the zero-config web demo picks the
# FIRST tileset in id order, and that must stay `ndvi`.
[[datasets]]
id = "hls-s30-fire"
title = "HLS Sentinel-2 (S30), 2024 Park Fire"
description = "Six-date T10TFK time series across the 2024 Park Fire."
license = "CC0-1.0"

[[datasets.layers]]
id = "park-fire-ndvi"
title = "Park Fire NDVI"
description = "(B8A - B04) / (B8A + B04), rescaled -1..1, grayscale."
kind = "ndvi"
colormap = "grayscale"
[datasets.layers.bands]
nir = "b8a"
red = "b04"

# CI (ENGINEERING.md §6, issues #3/#4).
# Shape: always-triggered workflow -> `changes` path filter -> per-language jobs
# -> single `ci-ok` aggregator, the ONLY required status check. Jobs skipped by
# the filter count as success; a failed or unexpectedly-missing job fails ci-ok.
# All actions SHA-pinned; least-privilege permissions; CI runs `just` recipes only.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  # Path filtering applies to PRs only. On push to main everything runs: it's
  # the post-squash re-verification, and paths-filter's push-mode git diff
  # can't fetch on a credential-less checkout in a private repo anyway.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR changed files via the API
    outputs:
      rust: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.rust }}
      stack: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.stack }}
      web: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.web }}
      python: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.python }}
      oracle: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.oracle }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        id: filter
        # dorny (original), not the step-security fork: the fork requires a paid
        # subscription on private repos. Revisit when the repo goes public.
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'justfile'
              - '.github/**'
            stack:
              - 'docker-compose.yml'
              - 'justfile'
              - '.github/**'
            web:
              - 'web/**'
              - 'justfile'
              - '.github/**'
            python:
              - 'python/**'
              - 'justfile'
              - '.github/**'
            oracle:
              - 'tests/**'
              - 'crates/swath-testkit/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - '.github/**'

  rust-fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "none"
      - run: just fmt-check

  rust-lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "none"
      - run: just lint

  rust-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "nextest"
      - run: just test

  rust-deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "deny"
      - run: just deny

  rust-msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.95"
      - run: cargo check --workspace

  rust-coverage:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "nextest llvm-cov"
      - run: just cov
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  # The GDAL/rio-tiler correctness oracle (ADR 0002: GDAL only in tests).
  # Verifies reference renders are byte-stable and the perceptual diff catches
  # a seeded single-pixel error — the gate every render-path PR builds on.
  oracle:
    needs: changes
    if: needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "none"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: tests/oracle/render_reference.py
      - run: just oracle-verify

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just@1.58.0
      - run: just setup-py
      - run: just lint-py
      - run: just test-py
      - run: just audit-py

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

  # Local-stack smoke: compose up (pgstac + MinIO), health + migration checks,
  # teardown. Grows into the real e2e harness as the binary/viewer land.
  e2e:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just@1.58.0
      - run: just e2e

  # REUSE/SPDX compliance: the open-core license boundary stays machine-checkable.
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Workflow static analysis. Cheap, so it runs unconditionally — it audits the
  # very file that defines it. Plain output for now: SARIF upload to code
  # scanning requires a public repo or GHAS; switch when the repo goes public.
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: zizmor@1.29.0
      - run: zizmor .github

  # The single required status check. Green iff every needed job succeeded or
  # was skipped by the path filter; red on any failure, cancellation, or a
  # failed `changes` job (which would silently skip everything downstream).
  ci-ok:
    needs: [changes, rust-fmt, rust-lint, rust-test, rust-deny, rust-msrv, rust-coverage, zizmor, reuse, e2e, web, python, oracle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded or were legitimately skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq .
          echo "$RESULTS" | jq -e '.changes.result == "success"' >/dev/null \
            || { echo "::error::changes job did not succeed"; exit 1; }
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' >/dev/null \
            || { echo "::error::a required job failed or was cancelled"; exit 1; }

# CI (ENGINEERING.md §6, issues #3/#4).
# Shape: always-triggered workflow -> `changes` path filter -> per-language jobs
# -> single `ci-ok` aggregator, the ONLY required status check. Jobs skipped by
# the filter count as success; a failed or unexpectedly-missing job fails ci-ok.
# All actions SHA-pinned; least-privilege permissions; CI runs `just` recipes only.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  # Path filtering applies to PRs only. On push to main everything runs: it's
  # the post-squash re-verification, and paths-filter's push-mode git diff
  # can't fetch on a credential-less checkout (persist-credentials: false).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR changed files via the API
    outputs:
      rust: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.rust }}
      docs: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.docs }}
      stack: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.stack }}
      web: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.web }}
      python: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.python }}
      oracle: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.oracle }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        id: filter
        # step-security fork of dorny/paths-filter (free now that the repo is
        # public): same action, plus StepSecurity's maintenance/review pipeline
        # — the maintained-fork preference of ENGINEERING.md §5. May trail
        # dorny's releases slightly; Renovate keeps the pin fresh.
        uses: step-security/paths-filter@9098a7821b83402dbe267c0c801e7d580ce74f92 # v4.0.2
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'README.md'
              - 'crates/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'justfile'
              - 'just/**'
              - '.config/nextest.toml'
              - '.github/**'
            rust:
              - 'crates/**'
              - 'tools/**'
              - 'examples/udf/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'justfile'
              - 'just/**'
              - '.config/nextest.toml'
              - '.github/**'
            stack:
              - 'docker-compose.yml'
              - 'Dockerfile'
              - '.dockerignore'
              - 'crates/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'tests/fixtures/**'
              - 'tests/e2e/**'
              - 'justfile'
              - 'just/**'
              - '.config/nextest.toml'
              - '.github/**'
            web:
              - 'web/**'
              - 'justfile'
              - 'just/**'
              - '.github/**'
            python:
              - 'python/**'
              - 'justfile'
              - 'just/**'
              - '.github/**'
            oracle:
              - 'tests/**'
              - 'crates/swath-testsupport/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - 'just/**'
              - '.github/**'

  rust-fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "none"
      - run: just fmt-check

  rust-lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "machete"
      - run: just lint
      - run: just machete

  # Cross-platform matrix on push to main; ubuntu alone on PRs (#426). The
  # macos and windows legs are the slowest jobs in the graph and have never
  # been the ones to catch a regression a PR introduced — they catch
  # toolchain and path-handling drift, which is a property of main, not of a
  # branch. Every merge still runs all three before the commit is released.
  rust-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "nextest"
      - run: just test

  # The docs-drift gate (issues #119/#173) on its own trigger: docs-only PRs
  # must run it too (the rust filter skips them). Full history + the
  # require-git env: the stamp gate's history-dependent tests (mutation
  # drift 6, the squash simulation) may skip on shallow checkouts elsewhere
  # (rust-test's matrix), but never here.
  docs-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          tools: "nextest"
      - run: just docs-check
        env:
          SWATH_DOCS_CHECK_REQUIRE_GIT: "1"

  rust-deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "deny"
      - run: just deny

  rust-msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.95"
      # The other rust jobs get registry/target caching via setup-rust's
      # embedded rust-cache; this bare-toolchain job needs its own (the
      # cache key includes the 1.95 toolchain, so it never collides).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace

  # The feature-off state of the `legacy-hdf5` gate (issue #99): the whole
  # workspace must keep compiling without the bundled libhdf5 C build — the
  # fast dev-loop profile (`just check-fast`) stays green. Cheap (no C
  # toolchain work), ubuntu only; the default state (feature ON) is what
  # every other rust job already builds.
  rust-check-fast:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "none"
      - run: just check-fast

  # The UDF guest-kit reproducibility gate (issue #202, ADR 0018): the
  # committed Rust fixture modules (swath-udf-wasmtime/tests/fixtures) must
  # be byte-identical to what examples/udf builds from source. wasm32
  # codegen is host-independent under the pinned toolchain (macOS-arm64 vs
  # Linux-x86_64 proven identical when the fixtures landed), so this single
  # ubuntu job covers every platform's rebuild.
  udf-guest:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "none"
      - run: just udf-fixtures-verify

  # Coverage on push to main only (#426): the number is a property of the
  # tree, not of a branch, and Codecov's PR delta was costing every PR ~3
  # minutes on the critical path for a figure nobody gated on.
  rust-coverage:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "nextest llvm-cov"
      - run: just cov
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  # The GDAL/rio-tiler correctness oracle (ADR 0002: GDAL only in tests).
  # Verifies reference renders are byte-stable and the perceptual diff catches
  # a seeded single-pixel error — the gate every render-path PR builds on.
  oracle:
    needs: changes
    if: needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "none"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: |
            tests/oracle/render_reference.py
            tests/fixtures/verify_fixtures.py
      - run: just oracle-verify
      - run: just fixtures-verify

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just@1.58.0
      - run: just setup-py
      - run: just lint-py
      - run: just test-py
      - run: just audit-py

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

  # The e2e stack image, built ONCE per run (#333): the web bundle and the
  # release binary compile natively under the cargo cache (rust-cache keys
  # on Cargo.lock and this job — a warm run recompiles only what changed),
  # the Dockerfile's runtime stage wraps the prebuilt binary in seconds, and
  # the image travels to the e2e jobs as an artifact. Before this, e2e and
  # e2e-web each ran a cold `cargo build --release` inside Docker (464 s and
  # 343 s on run 33201072681), in parallel, on every push.
  stack-image:
    needs: changes
    if: needs.changes.outputs.stack == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "none"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # The same two commands a release build runs (`just build-full`): the
      # UI bundle, then the binary that embeds it.
      - run: just build-full
      - name: Bake the runtime image around the prebuilt binary
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/swath dist/swath
          docker build --build-arg SWATH_BINARY_STAGE=prebuilt -t swath:ci .
          docker save swath:ci | zstd -T0 -3 -o swath-image.tar.zst
          ls -l swath-image.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stack-image
          path: swath-image.tar.zst
          retention-days: 1
          if-no-files-found: error

  # The compose-stack e2e (R8): builds the swath image, brings up the full
  # stack (swath + pgstac + MinIO), and exercises the binary end to end —
  # landing page, golden-tile oracle match (pdiff), trace header + SSE.
  # setup-rust is here for the pdiff comparator (`cargo run -p swath-testsupport`)
  # and nextest for the catalog integration suite, which runs first (it only
  # needs the pgstac service, so it fails fast before the image build).
  e2e:
    needs: [changes, stack-image]
    if: >-
      needs.changes.outputs.stack == 'true'
      && !contains(github.event.pull_request.labels.*.name, 'ci:skip-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SWATH_IMAGE: swath:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stack-image
      - run: zstd -d -c swath-image.tar.zst | docker load
      - uses: ./.github/actions/setup-rust
        with:
          tools: "nextest"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: tests/openeo/client_check.py
      - run: just test-catalog
      - run: just e2e

  # The viewer e2e (issue #33): the compose stack (via the shared
  # tests/e2e/stack-up.sh bring-up + granule drop) with the Playwright
  # suite driving the <swath-map> demo page against it. Needs BOTH the
  # docker stack and node, hence its own job spanning the stack and web
  # filters. No Rust toolchain: the bring-up is docker+curl only.
  e2e-web:
    needs: [changes, stack-image]
    if: >-
      (needs.changes.outputs.stack == 'true' || needs.changes.outputs.web == 'true')
      && !contains(github.event.pull_request.labels.*.name, 'ci:skip-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SWATH_IMAGE: swath:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stack-image
      - run: zstd -d -c swath-image.tar.zst | docker load
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just@1.58.0
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps
        working-directory: web
      # Both serving modes on push to main; the vite-dev mode alone on PRs
      # (#426). Binary mode re-runs the SAME 71 specs against the embedded
      # bundle — it is a serving-path check (embedded-ui, same-origin), and
      # a PR that changes neither the embedding nor the routes cannot fail
      # it while passing dev mode.
      - run: just e2e-web ${{ github.event_name == 'pull_request' && 'dev' || 'both' }}

  # REUSE/SPDX compliance: the open-core license boundary stays machine-checkable.
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Workflow static analysis. Cheap, so it runs unconditionally — it audits the
  # very file that defines it. Findings go to code scanning as SARIF AND fail
  # this job (so ci-ok stays the gate): the exit code is captured, the SARIF is
  # uploaded, then the job fails if zizmor found anything.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version is the justfile's (`zizmor_version`), the one place every
      # tool is pinned and Renovate bumps (#357).
      - id: pins
        run: echo "zizmor=$(grep -oE '^zizmor_version := "[0-9.]+"' justfile | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: zizmor@${{ steps.pins.outputs.zizmor }}
      - name: Run zizmor (SARIF)
        id: zizmor
        run: |
          set +e
          zizmor --format=sarif .github > zizmor.sarif
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      # Fork PRs get a read-only token that can't upload SARIF; the hard gate
      # below still applies to them.
      - name: Upload to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      - name: Fail on findings
        if: steps.zizmor.outputs.exit != '0'
        run: |
          zizmor .github || true
          exit 1

  # The single required status check. Green iff every needed job succeeded or
  # was skipped by the path filter; red on any failure, cancellation, or a
  # failed `changes` job (which would silently skip everything downstream).
  ci-ok:
    needs: [changes, rust-fmt, rust-lint, rust-test, docs-check, rust-deny, rust-msrv, rust-check-fast, udf-guest, rust-coverage, zizmor, reuse, e2e, e2e-web, web, python, oracle]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded or were legitimately skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
          SKIP_E2E: ${{ contains(github.event.pull_request.labels.*.name, 'ci:skip-e2e') }}
        run: |
          echo "$RESULTS" | jq .
          echo "$RESULTS" | jq -e '.changes.result == "success"' >/dev/null \
            || { echo "::error::changes job did not succeed"; exit 1; }
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' >/dev/null \
            || { echo "::error::a required job failed or was cancelled"; exit 1; }
          # A label-skipped e2e must never be silent: ci-ok is green, and it
          # says why (#426). Push-to-main runs are unaffected — the label
          # only exists on pull requests.
          if [ "${SKIP_E2E}" = "true" ]; then
            echo "::warning::e2e and e2e-web were skipped by the 'ci:skip-e2e' label. \
          The merge commit still runs both on main; see #426 for the restore plan."
          fi

# Dependency review on PRs (ENGINEERING.md §5 item 6, issue #50). Diffs the
# PR's dependency changes against the GitHub Advisory Database and fails on
# newly-introduced vulnerable dependencies; posts a summary comment. Backed by
# the dependency graph, which is free on public repos.

name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment-summary-in-pr posts/updates the PR comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

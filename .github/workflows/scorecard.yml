# OpenSSF Scorecard (ENGINEERING.md §5, issue #50). Weekly + push-to-main
# supply-chain posture score, published to the OpenSSF API (feeds the README
# badge) and uploaded to code scanning as SARIF. Cron offset from the nightly
# advisories run in security.yml.

name: Scorecard

on:
  schedule:
    - cron: "26 4 * * 1" # weekly (Mon); offset from security.yml's nightly 05:17
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # publish_results signs the results for the OpenSSF API
      actions: read # scorecard reads workflow runs for its CI checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: results.sarif

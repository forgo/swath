# Versioned GHCR image on release tags (docs/RELEASING.md, issue #116): the
# tag-push caller of image.yml — exactly one immutable tag,
# `ghcr.io/forgo/swath:v{version}` (`type=ref,event=tag`). `latest` does
# not move on pre-releases — it keeps tracking main until the graduation
# checklist (docs/RELEASING.md) says otherwise. A separate caller because
# `paths:` filters and tag triggers don't mix.

name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One publish at a time per tag, never cancelled mid-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write # GHCR digest + manifest push, scoped in the called jobs
    with:
      local-tag: ${{ github.ref_name }}
      tags: |
        type=ref,event=tag

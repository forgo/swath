# Versioned GHCR image on release tags (docs/RELEASING.md, issue #116).
# The tag-push sibling of publish-image.yml (which owns main-branch
# `latest`/`main`/`sha-*` publishing — a separate workflow because `paths:`
# filters and tag triggers don't mix): build the image once with buildx +
# GHA layer cache, SMOKE-TEST IT BEFORE PUSHING (the same shared script),
# then push exactly one immutable tag, `ghcr.io/forgo/swath:v{version}`.
# `latest` does not move on pre-releases — it keeps tracking main until the
# graduation checklist (docs/RELEASING.md) says otherwise. linux/amd64
# only, same as publish-image.yml (QEMU-emulated arm64 blows the budget).

name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One publish at a time per tag, never cancelled mid-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR push; scoped to this job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Exactly one tag: the release version, immutable
      # (`type=ref,event=tag` -> `v0.1.0-alpha.1`). OCI annotations ride
      # along as image labels, as on main.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
          labels: |
            org.opencontainers.image.description=Swath — cloud-native geospatial tiles: serve the committed HLS fixtures and the embedded viewer with `docker run -p 8080:8080 ghcr.io/forgo/swath serve --fixtures`
            org.opencontainers.image.licenses=Apache-2.0

      # Build for the local docker engine first — nothing is pushed until
      # the smoke test below has passed against this exact image.
      - name: Build (local, not yet pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same assertions the main-branch publish makes (shared script):
      # liveness, a real rendered tile, and the embedded UI.
      - name: Smoke-test the release image
        run: ./.github/scripts/smoke-image.sh "ghcr.io/forgo/swath:${GITHUB_REF_NAME}"

      - name: Record image size
        run: |
          set -euo pipefail
          size=$(docker image inspect --format '{{.Size}}' "ghcr.io/forgo/swath:${GITHUB_REF_NAME}")
          printf 'Image size: %d bytes (%d MB)\n' "$size" "$((size / 1000000))" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same context and platform — every layer comes out of the buildx
      # cache, so this is a push of the exact image that passed the smoke.
      - name: Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

# PR-title lint (ENGINEERING.md §7, issue #12). Squash-only merges make the PR
# title the commit title on main — release-plz reads that history, so titles
# must be conventional commits. Uses the StepSecurity maintained fork of the
# amannn action (free now that the repo is public; issue #50) — the
# maintained-fork preference of ENGINEERING.md §5, same call as ci.yml's
# paths-filter. The required check keeps its name: it's the job id below.

name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: step-security/action-semantic-pull-request@75d2dd5deafa3e9fccc1626ecd58d076ed1d2c79 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# GHCR image publishing on main (ENGINEERING.md §6, issues #104/#139): the
# main-branch caller of image.yml — `latest` + `main` (moving, default
# branch only) and `sha-<shortsha>` (immutable). `latest` exists so the
# README's bare `ghcr.io/forgo/swath` one-liner resolves. Main-only (CI
# wall-time respected); docs-only pushes don't cut an image.

name: Publish image

on:
  push:
    branches: [main]
    # The image-relevant set: everything COPY'd into the build context plus
    # the build definition itself.
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "web/**"
      - "tests/fixtures/**"
      - ".github/workflows/publish-image.yml"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, never cancelled mid-push: a half-updated tag set
# (`latest` moved, `main` not) is worse than a queued run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write # GHCR digest + manifest push, scoped in the called jobs
    with:
      local-tag: latest
      tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=ref,event=branch
        type=sha,prefix=sha-

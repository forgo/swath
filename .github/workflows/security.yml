# Scheduled security scanning (ENGINEERING.md §5, issue #7).
# Nightly RustSec advisories via cargo-deny; a failure files/updates a pinned
# issue so it can't scroll past unnoticed. Manual dispatch for validation.
#
# The rest of the §5 posture lives in sibling workflows: scorecard.yml (weekly
# OpenSSF Scorecard), codeql.yml (weekly Rust CodeQL), dependency-review.yml
# (per-PR), and ci.yml's zizmor job (SARIF + hard gate) — enabled by issue #50
# when the repo went public.

name: Security

on:
  schedule:
    - cron: "17 5 * * *" # nightly; off the top-of-hour thundering herd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version is the justfile's (`deny_version`), the one place every
      # tool is pinned and Renovate bumps (#357).
      - id: pins
        run: echo "deny=$(grep -oE '^deny_version := "[0-9.]+"' justfile | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-deny@${{ steps.pins.outputs.deny }}

      - name: Check RustSec advisories
        id: advisories
        run: |
          set +e
          cargo deny check advisories 2>&1 | tee deny-advisories.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: File or update advisory issue on failure
        if: steps.advisories.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "security: RustSec advisory check failing"
        run: |
          body="Nightly \`cargo deny check advisories\` failed on $(date -u +%F).

          \`\`\`
          $(tail -60 deny-advisories.log)
          \`\`\`

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --label "area:ci" --body "$body"
          fi

      - name: Fail the run if advisories failed
        if: steps.advisories.outputs.exit != '0'
        run: exit 1

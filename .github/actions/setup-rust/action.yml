name: Setup Rust
description: >-
  Toolchain from rust-toolchain.toml (with components), Swatinem rust-cache
  (embedded in setup-rust-toolchain: registry + git + target keyed on
  Cargo.lock), and the pinned dev tools via `just setup` (versions pinned in
  the justfile — one place, bumped by Renovate).

runs:
  using: composite
  steps:
    - name: Install toolchain (rust-toolchain.toml) + cache
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

    - name: Install just + cargo-binstall (prebuilt, checksum-verified)
      uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
      with:
        tool: just@1.58.0,cargo-binstall@1.21.1

    - name: Install pinned dev tools (CI set only)
      shell: bash
      run: just setup-ci

# cargo-deny configuration (ENGINEERING.md §2/§5, issue #5).
# Gates: security advisories, license allowlist, dependency bans, registry sources.
# Runs on every PR (`just deny`) and nightly (security.yml files issues on new advisories).

[graph]
all-features = true

[advisories]
# RustSec advisories: any advisory or yanked crate fails the gate.
yanked = "deny"

[licenses]
# Permissive-only allowlist (Apache-2.0 project, ADR 0003). Extend deliberately,
# per-license, when a dependency demands it — never with a blanket "OR later".
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # webpki-root-certs (Mozilla's CA root store as data, via reqwest/rustls
    # in object_store's S3 support, #29). CDLA-Permissive-2.0 is a permissive
    # data license: use/modify/redistribute freely, no copyleft, no
    # attribution requirement on results.
    "CDLA-Permissive-2.0",
    # libhdf5's own license (bundled source in hdf5-metno-src for the static
    # build, #40): a BSD-3-Clause-style permissive license with The HDF
    # Group's naming/attribution clauses. SPDX id `HDF5`.
    "HDF5",
]
confidence-threshold = 0.93
# The allowlist is aspirational until dependencies arrive; don't nag about
# licenses no current dep uses.
unused-allowed-license = "allow"

# hdf5-metno-src ships no `license` field in its manifest; the crate is the
# bundled libhdf5 source tree, whose license text (ext/hdf5/LICENSE) is the
# HDF5 license (detected at 0.88 confidence — below the threshold, hence the
# explicit clarification pinned to the file hash).
[[licenses.clarify]]
crate = "hdf5-metno-src"
expression = "HDF5"
license-files = [{ path = "ext/hdf5/LICENSE", hash = 0x221a80ac }]

[bans]
# Duplicate versions warn (tightened later); wildcard requirements are forbidden.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

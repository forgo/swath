SPDX-License-Identifier: Apache-2.0

The entry page (issue #108): a layer browser beside the <swath-map>
viewer. Zero server configuration on purpose (same origin — vite proxies
the OGC routes to the compose stack on :8080 in dev; the embedded bundle
is served by the binary itself). View state semantics live in main.ts:
the URL is the shareable representation, localStorage restores the last
session, URL params beat storage. Run `just e2e-web` for the full loop,
or bring the stack up yourself and `pnpm exec vite dev`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swath</title>
    <style>
      /* The page IS the shell (#284): tokens are adopted by the first
       * SwathElement; the page keeps only what no element owns. */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--swath-color-bg);
        color: var(--swath-color-fg);
        font-family: var(--swath-font-ui);
      }
      swath-shell {
        display: grid;
        height: 100%;
      }
      /* The slotted map fills the shell's main region. Sized HERE, not by
       * the shell's ::slotted() rule: document styles beat a shadow tree's
       * ::slotted() in the cascade, so the component's own :where(swath-map)
       * 400px default would otherwise win (it did — a 400px canvas). */
      swath-map[slot="map"] {
        position: absolute;
        inset: 0;
        height: 100%;
      }
      /* Composing (#400, ADR 0028): the map becomes the live preview column
       * beside the canvas. Sized HERE for the same reason as above — the
       * shell's ::slotted() rule loses to this document rule's `inset: 0`,
       * so a shell-side attempt at it applied the width and silently left
       * the column at the wrong edge, empty (#463). The shell reserves the
       * space; the consumer places the map in it. */
      swath-shell[compose] swath-map[slot="map"] {
        left: auto;
        right: 0;
        width: var(--swath-size-preview);
        box-sizing: border-box;
        border-inline-start: var(--swath-border-hairline);
      }
      @media (max-width: 1023px) {
        swath-shell[compose] swath-map[slot="map"] {
          left: 0;
          width: auto;
          border-inline-start: 0;
        }
      }
      .swath-rail-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--swath-space-2);
      }
      .swath-rail-title h1 {
        margin: 0;
        font-family: var(--swath-font-mono);
        font-size: var(--swath-text-lg);
        font-weight: 700;
        letter-spacing: var(--swath-tracking-wide);
        text-transform: uppercase;
      }
      .swath-rail-lede {
        margin: var(--swath-space-1) 0 0;
        font-size: var(--swath-text-sm);
        line-height: var(--swath-leading-normal);
        color: var(--swath-color-fg-muted);
      }
      /* Share (issue #211) feedback states, through ::part and the tokens. */
      #swath-share[data-state="copied"]::part(base) {
        border-color: var(--swath-color-accent-border);
        background: var(--swath-color-accent-bg);
        color: var(--swath-color-accent);
      }
      #swath-share[data-state="failed"]::part(base) {
        border-color: var(--swath-color-danger);
        color: var(--swath-color-danger);
      }
      /* Modes hide panels with `hidden`; each panel's own injected CSS says
       * `display: block`, which would beat the UA's [hidden] rule — this
       * element+attribute selector outranks it. */
      swath-layer-list[hidden],
      swath-catalog[hidden],
      swath-sources[hidden],
      swath-import[hidden],
      swath-add-data-panel[hidden],
      swath-authoring-panel[hidden] {
        display: none;
      }
      #swath-status-lonlat {
        cursor: copy;
      }
      #swath-author-inspector { padding: var(--swath-space-3); }
      #swath-search { margin-inline-start: auto; }
      #swath-rail-drawer-body { display: grid; gap: var(--swath-space-3); }
      #swath-xray-rail {
        display: flex;
        flex-direction: column;
        gap: var(--swath-space-2);
      }
      #swath-xray-rail[hidden] {
        display: none;
      }
      /* The feed card sits above MapLibre's attribution pill. */
      swath-hud-card[data-xray="bottom-right"] {
        margin-bottom: var(--swath-space-7);
      }
      .swath-rail-footer {
        font-family: var(--swath-font-mono);
        font-size: var(--swath-text-xs);
        color: var(--swath-color-fg-muted);
      }
      /* The footer holds a standing action above the provenance line. */
      #swath-new-layer {
        display: flex;
        margin-block-end: var(--swath-space-2);
      }
    </style>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <!-- One shell, five regions (ui-system.md §6). The map is slotted in
         LIGHT DOM so MapLibre keeps document scope and every
         document.querySelector("swath-map") keeps working. The HUD dock is
         empty until the map chrome moves onto it (#285/#286); map toggles
         stay MapLibre controls for now. -->
    <swath-shell view="layers">
      <swath-rail slot="rail" mode="layers">
        <div slot="brand">
          <div class="swath-rail-title">
            <h1>Swath</h1>
            <!-- Enabled once the first layer has applied (main.ts): it copies
                 the deep link of the CURRENT view — layer, center, zoom,
                 frame, x-ray — the same URL the address bar shows after an
                 interaction. -->
            <swath-button id="swath-share" size="sm" label="Copy a link to this exact view" disabled>
              share
            </swath-button>
          </div>
          <p class="swath-rail-lede">Live tiles from freshly ingested granules. Pick a layer; share copies the link to this exact view.</p>
        </div>
        <!-- Mode content: `layers` is the full rail as it always was; the
             other modes narrow it (main.ts, issue #283). -->
        <swath-layer-list></swath-layer-list>
        <!-- Data mode's catalog (issue #288): lazy until the mode is entered;
             every thumbnail is a preview the engine rendered. -->
        <swath-catalog hidden></swath-catalog>
        <!-- Sources mode (#418): what is watching, what is broken, and the
             first-run action that registers the committed fixtures. Lazy
             until the mode is entered. -->
        <swath-sources hidden></swath-sources>
        <!-- The guided import (#420): the register this deployment
             offers, and one detecting input. Lazy, like its neighbours. -->
        <swath-import hidden></swath-import>
        <!-- Collapsed and lazy (issue #197); its first open reads the
             capabilities document, so a read-only server shows no form. -->
        <swath-add-data-panel></swath-add-data-panel>
        <!-- Also collapsed and lazy (issue #109): fetches nothing until opened. -->
        <swath-authoring-panel></swath-authoring-panel>
        <!-- X-ray mode (issue #286): the overlay's display modes and the
             analytics summary live here under view=xray; the readouts,
             feed and inspector are HUD cards over the map. -->
        <section id="swath-xray-rail" aria-label="X-ray" hidden>
          <div id="swath-xray-modes"></div>
          <div id="swath-xray-analytics"></div>
        </section>
        <!-- The one action that should never be more than a click away
             (issue #398): standing in the panel footer, not buried in the
             Layers panel where only one mode could reach it. -->
        <swath-button
          slot="footer"
          id="swath-new-layer"
          icon="plus"
          size="sm"
          label="Author a new layer"
          >new layer</swath-button
        >
        <span slot="footer" class="swath-rail-footer">granule → pixel</span>
      </swath-rail>
      <span slot="topbar" id="swath-mode-title">Layers</span>
      <!-- The URL made visible (issue #393): what this view is OF.
           Removing a chip drops its parameter, which is a pushState. -->
      <swath-chip-row slot="topbar" id="swath-chips"></swath-chip-row>
      <!-- Every action by name (issue #292): ⌘K / Ctrl-K or this button. -->
      <swath-button slot="topbar" id="swath-search" icon="search" size="sm" label="Commands (⌘K)">commands</swath-button>
      <!-- switcher="off": the layer list IS the switcher on this page. -->
      <!-- traces: the status bar's ingest→pixel cell wants the trace stream
           even with the x-ray off (issue #287). -->
      <swath-map slot="map" switcher="off" traces></swath-map>
      <swath-hud-dock slot="hud"></swath-hud-dock>
      <!-- The publish receipt and the explain card are one component
           (issue #394/#395): tethered, dismissible, never over the map. -->
      <swath-explain-card id="swath-explain"></swath-explain-card>
      <!-- Author mode (issue #291): the step strip over the map, the
           selected step's fields in the inspector column. M11 swaps the
           strip for the DAG editor — a content change, not a layout one. -->
      <!-- Below the wide tier the rail's mode content lives here (issue #293):
           a right drawer at 640–1279, a bottom sheet with 40/90 snaps under 640. -->
      <swath-drawer slot="main" id="swath-rail-drawer" edge="right" snap="40,90" label="Panel">
        <div id="swath-rail-drawer-body"></div>
      </swath-drawer>
      <swath-drawer slot="main" id="swath-author-dock" edge="bottom" size="38%" label="Pipeline">
        <span slot="header">Pipeline</span>
        <div id="swath-author-strip"></div>
      </swath-drawer>
      <div slot="inspector" id="swath-author-inspector"></div>
      <swath-status-bar slot="statusbar">
        <swath-status-cell id="swath-status-lonlat" label="lon/lat" mono title="Click to copy"></swath-status-cell>
        <swath-status-cell id="swath-status-zoom" label="zoom" mono></swath-status-cell>
        <swath-status-cell id="swath-status-crs" label="crs" mono></swath-status-cell>
        <swath-status-cell id="swath-status-ingest" label="ingest→pixel" mono chip-keep></swath-status-cell>
      </swath-status-bar>
    </swath-shell>
    <swath-command-palette label="Commands"></swath-command-palette>
  </body>
</html>

SPDX-FileCopyrightText: 2026 Elliott Richerson <elliott.richerson@gmail.com>
SPDX-License-Identifier: Apache-2.0

The entry page (issue #108): a layer browser beside the <swath-map>
viewer. Zero server configuration on purpose (same origin — vite proxies
the OGC routes to the compose stack on :8080 in dev; the embedded bundle
is served by the binary itself). View state semantics live in main.ts:
the URL is the shareable representation, localStorage restores the last
session, URL params beat storage. Run `just e2e-web` for the full loop,
or bring the stack up yourself and `pnpm exec vite dev`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swath</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        background: #0f172a;
        color: #e2e8f0;
      }
      .swath-rail {
        flex: 0 0 248px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px 14px;
        box-sizing: border-box;
        overflow-y: auto;
        border-right: 1px solid rgb(148 163 184 / 15%);
      }
      .swath-rail-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .swath-rail header h1 {
        margin: 0;
        font: 700 15px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      /* Share (issue #211): the copy-link action, in the rail's own
       * monospace label voice; the copied state borrows the x-ray green. */
      .swath-share {
        margin: 0;
        padding: 3px 9px;
        border: 1px solid rgb(148 163 184 / 35%);
        border-radius: 4px;
        background: none;
        color: rgb(148 163 184 / 90%);
        font: 700 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .swath-share:hover:enabled {
        background: rgb(148 163 184 / 12%);
        color: #e2e8f0;
      }
      .swath-share:focus-visible {
        outline: 2px solid #4ade80;
        outline-offset: 1px;
      }
      .swath-share:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .swath-share[data-state="copied"] {
        border-color: rgb(74 222 128 / 45%);
        background: rgb(74 222 128 / 10%);
        color: #4ade80;
      }
      .swath-share[data-state="failed"] {
        border-color: rgb(248 113 113 / 45%);
        color: #f87171;
      }
      .swath-rail header p {
        margin: 4px 0 0;
        font: 12px/1.5 system-ui, sans-serif;
        color: rgb(148 163 184 / 90%);
      }
      .swath-rail footer {
        margin-top: auto;
        font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: rgb(148 163 184 / 70%);
      }
      swath-map {
        flex: 1;
        height: 100%;
        min-width: 0;
      }
      @media (max-width: 640px) {
        body {
          flex-direction: column;
        }
        .swath-rail {
          flex: 0 0 auto;
          max-height: 40%;
          border-right: none;
          border-bottom: 1px solid rgb(148 163 184 / 15%);
        }
      }
    </style>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <aside class="swath-rail">
      <header>
        <div class="swath-rail-title">
          <h1>Swath</h1>
          <!-- Enabled once the first layer has applied (main.ts): it copies
               the deep link of the CURRENT view — layer, center, zoom,
               frame, x-ray — the same URL the address bar shows after an
               interaction. -->
          <button
            type="button"
            id="swath-share"
            class="swath-share"
            title="Copy a link to this exact view"
            aria-label="Copy a link to this exact view"
            disabled
          >
            share
          </button>
        </div>
        <p>Live tiles from freshly ingested granules. Pick a layer; share copies the link to this exact view.</p>
      </header>
      <swath-layer-panel></swath-layer-panel>
<!-- Collapsed by default; fetches nothing until opened (issue #110). -->
      <swath-dataset-panel></swath-dataset-panel>
      <!-- Collapsed and lazy (issue #197); its first open reads the
           capabilities document, so a read-only server shows no form. -->
      <swath-add-data-panel></swath-add-data-panel>
      <!-- Also collapsed and lazy (issue #109): fetches nothing until opened. -->
      <swath-authoring-panel></swath-authoring-panel>
      <footer>granule → pixel</footer>
    </aside>
    <!-- switcher="off": the layer panel IS the switcher on this page. -->
    <swath-map switcher="off"></swath-map>
  </body>
</html>

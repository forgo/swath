The <swath-map> demo: zero configuration on purpose. No server attribute
(same origin — vite proxies the OGC routes to the compose stack on :8080),
no layer (first tileset wins), no center/zoom (the view fits the layer's
bounds from tileset metadata). Run `just e2e-web` for the full loop, or
bring the stack up yourself and `pnpm exec vite dev`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swath viewer demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      swath-map {
        height: 100%;
      }
    </style>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <swath-map></swath-map>
  </body>
</html>

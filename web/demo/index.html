SPDX-License-Identifier: Apache-2.0

The entry page (issue #108): a layer browser beside the <swath-map>
viewer. Zero server configuration on purpose (same origin — vite proxies
the OGC routes to the compose stack on :8080 in dev; the embedded bundle
is served by the binary itself). View state semantics live in main.ts:
the URL is the shareable representation, localStorage restores the last
session, URL params beat storage. Run `just e2e-web` for the full loop,
or bring the stack up yourself and `pnpm exec vite dev`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swath</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        background: #0f172a;
        color: #e2e8f0;
      }
      .swath-rail {
        flex: 0 0 248px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px 14px;
        box-sizing: border-box;
        overflow-y: auto;
        border-right: 1px solid rgb(148 163 184 / 15%);
      }
      .swath-rail-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .swath-rail header h1 {
        margin: 0;
        font: 700 15px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      /* Share (issue #211) is a <swath-button> (#280): its skin comes from
       * the primitive; only the copied/failed feedback states live here,
       * through ::part and the tokens. */
      #swath-share[data-state="copied"]::part(base) {
        border-color: var(--swath-color-accent-border);
        background: var(--swath-color-accent-bg);
        color: var(--swath-color-accent);
      }
      #swath-share[data-state="failed"]::part(base) {
        border-color: var(--swath-color-danger);
        color: var(--swath-color-danger);
      }
      #swath-modes {
        display: flex;
        gap: var(--swath-space-1);
        margin: 0 0 var(--swath-space-3);
      }
      .swath-rail header p {
        margin: 4px 0 0;
        font: 12px/1.5 system-ui, sans-serif;
        color: rgb(148 163 184 / 90%);
      }
      .swath-rail footer {
        margin-top: auto;
        font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: rgb(148 163 184 / 70%);
      }
      swath-map {
        flex: 1;
        height: 100%;
        min-width: 0;
      }
      @media (max-width: 640px) {
        body {
          flex-direction: column;
        }
        .swath-rail {
          flex: 0 0 auto;
          max-height: 40%;
          border-right: none;
          border-bottom: 1px solid rgb(148 163 184 / 15%);
        }
      }
    </style>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <aside class="swath-rail">
      <header>
        <div class="swath-rail-title">
          <h1>Swath</h1>
          <!-- Enabled once the first layer has applied (main.ts): it copies
               the deep link of the CURRENT view — layer, center, zoom,
               frame, x-ray — the same URL the address bar shows after an
               interaction. -->
          <swath-button id="swath-share" size="sm" label="Copy a link to this exact view" disabled>
            share
          </swath-button>
        </div>
        <p>Live tiles from freshly ingested granules. Pick a layer; share copies the link to this exact view.</p>
      </header>
      <!-- Modes (issue #283): the URL's view= param, shown as a pressed
           strip until the shell's rail (#284) replaces it. Panels below
           are shown or hidden per mode; `layers` is today's full rail. -->
      <nav id="swath-modes" aria-label="Mode">
        <swath-button size="sm" data-mode="layers" pressed>layers</swath-button>
        <swath-button size="sm" data-mode="data" pressed="false">data</swath-button>
        <swath-button size="sm" data-mode="author" pressed="false">author</swath-button>
        <swath-button size="sm" data-mode="xray" pressed="false">x-ray</swath-button>
      </nav>
      <swath-layer-list></swath-layer-list>
<!-- Collapsed by default; fetches nothing until opened (issue #110). -->
      <swath-dataset-panel></swath-dataset-panel>
      <!-- Collapsed and lazy (issue #197); its first open reads the
           capabilities document, so a read-only server shows no form. -->
      <swath-add-data-panel></swath-add-data-panel>
      <!-- Also collapsed and lazy (issue #109): fetches nothing until opened. -->
      <swath-authoring-panel></swath-authoring-panel>
      <footer>granule → pixel</footer>
    </aside>
    <!-- switcher="off": the layer panel IS the switcher on this page. -->
    <swath-map switcher="off"></swath-map>
  </body>
</html>

<!-- The Swath icon sheet (docs/design/ui-system.md §4.6). 16 × 16 grid, 1.5 px
     strokes in currentColor, no fills unless stated. <swath-icon name> clones a
     symbol into its shadow root. NAMES are the M10 contract (icon.test.ts pins
     them); M12 may redraw any glyph, never rename one. -->
<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Swath icons</title>
  <symbol id="layers" viewBox="0 0 16 16"><path d="M8 2.5 14 5.5 8 8.5 2 5.5Z"/><path d="m2 8.5 6 3 6-3"/><path d="m2 11.5 6 3 6-3"/></symbol>
  <symbol id="data" viewBox="0 0 16 16"><ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4"/><path d="M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/></symbol>
  <symbol id="author" viewBox="0 0 16 16"><rect x="2" y="2.5" width="4" height="4" rx="1"/><rect x="10" y="9.5" width="4" height="4" rx="1"/><path d="M6 4.5h2.5a2 2 0 0 1 2 2V9.5"/></symbol>
  <symbol id="xray" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="1.5"/><path d="M8 2.5v2M8 11.5v2M2.5 8h2M11.5 8h2"/></symbol>
  <symbol id="eye" viewBox="0 0 16 16"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="2"/></symbol>
  <symbol id="eye-off" viewBox="0 0 16 16"><path d="M3 3l10 10"/><path d="M6.6 4.1A6.9 6.9 0 0 1 8 3.5c4 0 6.5 4.5 6.5 4.5a11 11 0 0 1-2 2.4"/><path d="M4.4 5.4A10.6 10.6 0 0 0 1.5 8S4 12.5 8 12.5a6.7 6.7 0 0 0 2.6-.5"/><path d="M6.6 6.6a2 2 0 0 0 2.8 2.8"/></symbol>
  <symbol id="more" viewBox="0 0 16 16"><circle cx="8" cy="3.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="12.5" r="1.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="share" viewBox="0 0 16 16"><path d="M6.5 9.5 9.5 6.5"/><path d="M7 4.5 8.5 3a2.5 2.5 0 0 1 3.5 3.5L10.5 8"/><path d="M9 11.5 7.5 13A2.5 2.5 0 0 1 4 9.5L5.5 8"/></symbol>
  <symbol id="link" viewBox="0 0 16 16"><path d="M6.5 9.5 9.5 6.5"/><path d="M7 4.5 8.5 3a2.5 2.5 0 0 1 3.5 3.5L10.5 8"/><path d="M9 11.5 7.5 13A2.5 2.5 0 0 1 4 9.5L5.5 8"/></symbol>
  <symbol id="close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
  <symbol id="chevron-down" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></symbol>
  <symbol id="chevron-right" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4"/></symbol>
  <symbol id="chevron-left" viewBox="0 0 16 16"><path d="m10 4-4 4 4 4"/></symbol>

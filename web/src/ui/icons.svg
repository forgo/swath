  <symbol id="trash" viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5v-2h3v2"/><path d="M4 4.5l.7 9h6.6l.7-9"/><path d="M6.7 7v4.5M9.3 7v4.5"/></symbol>
  <symbol id="drag" viewBox="0 0 16 16"><circle cx="6" cy="4" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="4" r="1" fill="currentColor" stroke="none"/><circle cx="6" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="6" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="12" r="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></symbol>
  <symbol id="command" viewBox="0 0 16 16"><path d="M5.5 5.5h5v5h-5Z"/><path d="M5.5 5.5H4a1.5 1.5 0 1 1 1.5-1.5ZM10.5 5.5H12a1.5 1.5 0 1 0-1.5-1.5ZM5.5 10.5H4a1.5 1.5 0 1 0 1.5 1.5ZM10.5 10.5H12a1.5 1.5 0 1 1-1.5 1.5Z"/></symbol>

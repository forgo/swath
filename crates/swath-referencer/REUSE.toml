# REUSE 3.3 annotations for the files this **published package** carries
# that cannot bear SPDX headers themselves (ADR 0016: each published crate
# is REUSE-compliant standing alone, not only inside the repo aggregate).
version = 1
SPDX-PackageName = "swath-referencer"
SPDX-PackageDownloadLocation = "https://github.com/forgo/swath"

[[annotations]]
path = [
    "Cargo.toml",
    "README.md",
    "REUSE.toml",
    "tests/data/tiny.h5",
    "tests/data/tiny.expected.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Elliott Richerson <elliott.richerson@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# Real VNP09GA StructMetadata.0 text, committed verbatim as parser test
# truth (NASA LP DAAC data carry no use restrictions) — same treatment as
# the repo-root REUSE.toml gives this file.
[[annotations]]
path = ["tests/data/structmetadata_vnp09ga.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Elliott Richerson <elliott.richerson@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

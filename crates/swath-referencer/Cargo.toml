# SPDX headers: covered by REUSE.toml aggregate annotation for **/Cargo.toml.
[package]
name = "swath-referencer"
description = "Pure-Rust virtual-reference generator (kerchunk-style byte-range manifests): HDF5/NetCDF4 via hdf5-metno, GRIB2 via gribberish — byte-identical to the VirtualiZarr reference, library + optional CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["hdf5", "grib2", "kerchunk", "virtualizarr", "zarr"]
categories = ["science::geo", "parser-implementations"]
# One of the five publishable crates (ADR 0016, #192; swath-udf-guest joined
# in #209); the actual
# `cargo publish` is maintainer-executed per docs/RELEASING.md's crates tier.
publish = true

[package.metadata.docs.rs]
# Document the full surface: the HDF5 half (`legacy-hdf5`) and the CLI.
all-features = true

# The conformance harness's equivalence gate (`just test-referencer`,
# README §conformance). No extra deps — always built.
[[bin]]
name = "vmanifest-compare"
path = "src/bin/vmanifest_compare.rs"

# The standalone CLI (issue #188): granule in, manifest JSON out. Behind
# the `cli` feature so library consumers never pull clap.
[[bin]]
name = "swath-referencer"
path = "src/bin/swath_referencer.rs"
required-features = ["cli"]

[features]
default = ["legacy-hdf5"]
# HDF5/NetCDF4 referencing via hdf5-metno's statically bundled libhdf5
# (issue #99). Default ON: `just test`, the release binary, and the Docker
# image all carry it (REQUIREMENTS R8 — out of the box means legacy
# granules work). OFF is the fast dev-loop profile: no C toolchain, no
# libhdf5 build; `handles()` stops claiming .h5/.nc and `generate` returns
# a loud "built without the legacy-hdf5 feature" error. GRIB2 stays
# unconditional — gribberish is pure Rust and costs nothing.
legacy-hdf5 = ["dep:hdf5-metno"]
# The standalone `swath-referencer` binary (issue #188). Opt-in so the
# library surface stays clap-free.
cli = ["dep:clap"]

[dependencies]
# The standalone CLI's argument parsing; only with the `cli` feature.
clap = { workspace = true, optional = true }
# GRIB2 metadata walk (prototype 0001: message offsets/lengths/grids/packing
# come straight from the section structs — no field decode, no default
# features).
gribberish = { workspace = true }
# HDF5/NetCDF4 chunk-index walk (prototype 0001: chunks_visit/H5Dchunk_iter,
# filter pipeline, type descriptors). `static` bundles libhdf5 built from
# source — no system HDF5 anywhere, keeping the single-binary deployment
# story (ADR 0006 H4: 4.5 MB binary vs a 273 MB Python env). Optional
# behind `legacy-hdf5` (default ON — issue #99): the bundled C build costs
# minutes of wall clock and gigabytes of target/, so dev loops that never
# touch HDF5 can opt out (`just check-fast` / `just test-fast`) while every
# default build — `just test`, release, Docker — keeps it exactly as before.
hdf5-metno = { workspace = true, optional = true }
# The manifest schema, consumed directly per the extraction boundary
# (ADR 0016, docs/design/extraction-boundary.md §1): the referencer's
# output contract, published alongside it and re-exported as
# `swath_referencer::manifest`.
swath-manifest = { path = "../swath-manifest", version = "0.1.0-alpha.1" }
# The crate-own error taxonomy (ADR 0016 standalone rule: the port trait
# and its error stay home in swath-core; this crate speaks for itself).
thiserror = { workspace = true }

[dev-dependencies]
# Nothing unpublished, on purpose: the packaged test suite is self-contained
# (tests/util/mod.rs carries the std-only TempDir/gated_var helpers), so the
# published crate resolves and tests outside this workspace.

[lints]
workspace = true

[package]
name = "swath-testkit"
description = "Test-only utilities: perceptual image diff against the GDAL/rio-tiler oracle (never shipped)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
image = { workspace = true }

# Dev-only on purpose: only `pdiff`'s #[cfg(test)] module uses the shared
# temp dirs, and dev-dependencies cover a bin target's unit tests. The
# testkit ships (locally) as tooling; testsupport never leaves test builds.
[dev-dependencies]
swath-testsupport = { path = "../swath-testsupport", version = "0.1.0-alpha.1" }

[lints]
workspace = true

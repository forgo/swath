[package]
name = "swath-core"
description = "Swath domain core: types, port traits, planner, trace model. No I/O. (Compiler + Render IR live in swath-render.)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
# The catalog's STAC converters are pure serde_json::Value transforms
# (docs/design/catalog-domain.md §3) — still no I/O.
serde_json = { workspace = true }
# The TileCache key (#36): SHA-256, stable across releases/architectures
# (cache keys name store objects). Pure computation; the core stays I/O-free.
sha2 = { workspace = true }
# Manifest v1 lives in its own published-boundary crate (ADR 0016, #187);
# the core re-exports it as `swath_core::manifest` and keeps the
# `IngestReferencer` port speaking `VirtualManifest`.
swath-manifest = { path = "../swath-manifest", version = "0.1.0-alpha.1" }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "planner"
harness = false

[lints]
workspace = true

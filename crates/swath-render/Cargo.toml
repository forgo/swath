# SPDX headers: covered by REUSE.toml aggregate annotation for **/Cargo.toml.
[package]
name = "swath-render"
description = "Tiler pixel stages: warp/resample kernels, the Render IR pixel ops (band math, rescale, composite), and PNG tile encoding, validated against the GDAL oracle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
swath-core = { path = "../swath-core", version = "0.0.0" }
thiserror = { workspace = true }
# Cache-failure policy logging (#36): a failed get is a miss, a failed
# write-through is a warning — both logged, never a failed response.
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
insta = { workspace = true }
object_store = { workspace = true }
proptest = { workspace = true }
swath-cache-objectstore = { path = "../adapters/swath-cache-objectstore", version = "0.0.0" }
swath-reproject-proj4rs = { path = "../adapters/swath-reproject-proj4rs", version = "0.0.0" }
swath-source-cog = { path = "../adapters/swath-source-cog", version = "0.0.0" }
swath-testkit = { path = "../swath-testkit", version = "0.0.0" }
swath-testsupport = { path = "../swath-testsupport", version = "0.0.0" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "render"
harness = false

[lints]
workspace = true

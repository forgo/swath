# SPDX headers: covered by REUSE.toml aggregate annotation for **/Cargo.toml.
[package]
name = "swath-render"
description = "Tiler warp/resample kernels: source-window computation and nearest/bilinear resampling into WebMercator tile grids, validated against the GDAL oracle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
swath-core = { path = "../swath-core", version = "0.0.0" }
thiserror = { workspace = true }

[dev-dependencies]
object_store = { workspace = true }
proptest = { workspace = true }
swath-reproject-proj4rs = { path = "../adapters/swath-reproject-proj4rs", version = "0.0.0" }
swath-source-cog = { path = "../adapters/swath-source-cog", version = "0.0.0" }
swath-testkit = { path = "../swath-testkit", version = "0.0.0" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

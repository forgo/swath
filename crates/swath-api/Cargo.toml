# SPDX headers: covered by REUSE.toml aggregate annotation for **/Cargo.toml.
[package]
name = "swath-api"
description = "Inbound HTTP adapter: the OGC API - Tiles surface (axum) over the tiler engine — standards-shaped routes, no domain logic in handlers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# `tokio` beyond the workspace default: axum's `KeepAlive` (the SSE ping
# timer) is gated behind axum's `tokio` feature (#28).
axum = { workspace = true, features = ["tokio"] }
futures-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
swath-core = { path = "../swath-core", version = "0.0.0" }
swath-render = { path = "../swath-render", version = "0.0.0" }
thiserror = { workspace = true }
# `sync` only: the trace bus is a `tokio::sync::broadcast` channel (#28).
# The runtime itself still arrives with the binary (#29).
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
# `http1` (+ the `tokio` feature above): the SSE tests drive a real
# `axum::serve` on an ephemeral port — `tower::oneshot` has no streaming-
# body affordance. Dev-only; the production server wiring stays with #29.
axum = { workspace = true, features = ["http1", "tokio"] }
http-body-util = { workspace = true }
image = { workspace = true }
jsonschema = { workspace = true }
object_store = { workspace = true }
swath-reproject-proj4rs = { path = "../adapters/swath-reproject-proj4rs", version = "0.0.0" }
swath-source-cog = { path = "../adapters/swath-source-cog", version = "0.0.0" }
swath-testkit = { path = "../swath-testkit", version = "0.0.0" }
# `net`/`io-util`/`time`: the SSE tests' hand-rolled HTTP client (TCP +
# chunked-transfer reader + timeouts).
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }
tower = { workspace = true }

[lints]
workspace = true

# SPDX headers: covered by REUSE.toml aggregate annotation for **/Cargo.toml.
[package]
name = "swath-api"
description = "Inbound HTTP adapter: the OGC API - Tiles surface (axum) over the tiler engine — standards-shaped routes, no domain logic in handlers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# `tokio` beyond the workspace default: axum's `KeepAlive` (the SSE ping
# timer) is gated behind axum's `tokio` feature (#28); `query` gates the
# `Query` extractor the granule browsing route parses parameters with (#107).
axum = { workspace = true, features = ["query", "tokio"] }
futures-core = { workspace = true }
# The local-mode upload surface (#197): `PUT /uploads/{filename}` writes
# straight into the serving object store, so a browser-dropped file lands
# under the same root granule registration then validates against.
object_store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Content-derived service ids for the openEO surface (ADR 0010): the id of
# a published service is a hash of its process graph.
sha2 = { workspace = true }
swath-core = { path = "../swath-core", version = "0.1.0-alpha.1" }
swath-render = { path = "../swath-render", version = "0.1.0-alpha.1" }
thiserror = { workspace = true }
# `sync` only: the trace bus is a `tokio::sync::broadcast` channel (#28).
# The runtime itself still arrives with the binary (#29).
tokio = { workspace = true, features = ["sync"] }
# `cors` only: the opt-in CORS layer (issue #103, ADR 0011) — the origin
# allowlist is the whole policy, built here so the decision, the layer,
# and its integration test live together.
tower-http = { workspace = true, features = ["cors"] }

[dev-dependencies]
# Encoding the fixture module as a `data:` URL in the run_udf suite.
base64 = { workspace = true }
# `http1` (+ the `tokio` feature above): the SSE tests drive a real
# `axum::serve` on an ephemeral port — `tower::oneshot` has no streaming-
# body affordance. Dev-only; the production server wiring stays with #29.
axum = { workspace = true, features = ["http1", "tokio"] }
http-body-util = { workspace = true }
image = { workspace = true }
# openEO error-shape snapshots (the #32 diagnostics through the services
# surface).
insta = { workspace = true }
jsonschema = { workspace = true }
swath-cache-objectstore = { path = "../adapters/swath-cache-objectstore", version = "0.1.0-alpha.1" }
swath-reproject-proj4rs = { path = "../adapters/swath-reproject-proj4rs", version = "0.1.0-alpha.1" }
swath-source-cog = { path = "../adapters/swath-source-cog", version = "0.1.0-alpha.1" }
swath-testkit = { path = "../swath-testkit", version = "0.1.0-alpha.1" }
# The real run_udf publish motion end to end (#204): the wasmtime
# registrar over the committed fixture modules, the object_store module
# store in memory.
swath-modulestore-objectstore = { path = "../adapters/swath-modulestore-objectstore", version = "0.1.0-alpha.1" }
swath-udf-wasmtime = { path = "../adapters/swath-udf-wasmtime", version = "0.1.0-alpha.1" }
# `net`/`io-util`/`time`: the SSE tests' hand-rolled HTTP client (TCP +
# chunked-transfer reader + timeouts).
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }
tower = { workspace = true }

[lints]
workspace = true

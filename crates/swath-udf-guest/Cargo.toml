# SPDX headers: covered by REUSE.toml aggregate annotation for **/Cargo.toml.
[package]
name = "swath-udf-guest"
description = "Guest-side kit for Swath UDF ABI v1 (docs/udf-abi/v1.md, ADR 0018): the ABI structs, strict header parse/emit, and the swath_udf! macro producing the four exports — no_std-friendly, zero dependencies, built for wasm32-unknown-unknown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["wasm", "udf", "raster", "gis", "no-std"]
categories = ["wasm", "no-std", "science::geo"]
# One of the five publishable crates (ADR 0016's four, #192, plus this kit —
# ADR 0020, the #209 SDK decision, maintainer-approved name); the actual
# `cargo publish` is maintainer-executed per docs/RELEASING.md's crates tier.
publish = true

[package.metadata.docs.rs]
all-features = true

# Zero dependencies, deliberately: the wire header is four fixed integer
# fields, hand-parsed strictly (deny-unknown), so guests carry no serde/JSON
# machinery into their .wasm and the kit has no no_std feature battles.
[dependencies]

[lints]
workspace = true

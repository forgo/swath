# SPDX headers: covered by REUSE.toml aggregate annotation for **/Cargo.toml.
[package]
name = "swath-cli"
description = "The `swath` binary: wires the concrete Phase-1 adapters into the OGC API - Tiles surface and serves it (`swath serve`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The one crate WITHOUT `publish = false`, deliberately (issue #116):
# `release-plz release` skips manifest-unpublishable packages outright —
# verified against v0.3.160 (project.rs `publishable_packages()`) — and this
# is the package whose `v{version}` tag releases the workspace
# (release-plz.toml). Nothing can reach crates.io anyway: every path
# dependency below is `publish = false`, which `cargo publish` rejects, and
# release-plz's own config says `publish = false` + `git_only`.

# `publish = false` in the manifest would likewise hide the binary from
# cargo-dist; `dist = true` opts the `swath` binary in to release artifacts
# (docs/RELEASING.md).
[package.metadata.dist]
dist = true

# The crate is `swath-cli` (ARCHITECTURE.md §12); the installed binary is
# plain `swath`.
[[bin]]
name = "swath"
path = "src/main.rs"

[features]
default = ["embedded-ui", "legacy-hdf5"]
# Compile the production web bundle (web/dist, built by `pnpm build` /
# `just build-full`) into the binary and serve it at `/` (issue #103,
# ADR 0011). Default ON — the shipped binary carries its UI, like the
# statically bundled libhdf5. Without web/dist the build still compiles
# (the build script embeds an empty set and serving is UI-less); opt out
# entirely with `--no-default-features`.
embedded-ui = ["dep:include_dir"]
# HDF5/NetCDF4 referencing (swath-referencer's statically bundled libhdf5 —
# issue #99). Default ON: the shipped binary and Docker image reference
# legacy granules out of the box (R8). The fast dev-loop profile turns it
# off (`just check-fast` / `just test-fast`: no C toolchain, no libhdf5
# build); a feature-off binary declines .h5/.nc with a loud "built without
# the legacy-hdf5 feature" error. GRIB2 referencing is always compiled.
legacy-hdf5 = ["swath-referencer/legacy-hdf5"]

[dependencies]
include_dir = { workspace = true, optional = true }
# `http1` + `tokio`: this is the crate that actually runs `axum::serve`
# (the API crate only builds Routers — see its manifest).
axum = { workspace = true, features = ["http1", "tokio"] }
clap = { workspace = true }
# `aws` beyond the workspace default: `SWATH_STORE_ROOT=s3://...` builds an
# AmazonS3 store from the standard AWS_* environment (MinIO included).
object_store = { workspace = true, features = ["aws"] }
serde = { workspace = true }
swath-api = { path = "../swath-api", version = "0.1.0-alpha.1" }
swath-cache-objectstore = { path = "../adapters/swath-cache-objectstore", version = "0.1.0-alpha.1" }
swath-catalog-pgstac = { path = "../adapters/swath-catalog-pgstac", version = "0.1.0-alpha.1" }
swath-core = { path = "../swath-core", version = "0.1.0-alpha.1" }
swath-events-filedrop = { path = "../adapters/swath-events-filedrop", version = "0.1.0-alpha.1" }
swath-pyramid-objectstore = { path = "../adapters/swath-pyramid-objectstore", version = "0.1.0-alpha.1" }
# The production referencer behind the IngestReferencer port (ADR 0006):
# `swath ingest reference` and the serve-time filedrop legacy path.
# default-features = false so this crate's own `legacy-hdf5` feature (above,
# default ON) is the single switch for the bundled libhdf5 build.
swath-referencer = { path = "../swath-referencer", version = "0.1.0-alpha.1", default-features = false }
swath-render = { path = "../swath-render", version = "0.1.0-alpha.1" }
swath-reproject-proj4rs = { path = "../adapters/swath-reproject-proj4rs", version = "0.1.0-alpha.1" }
swath-source-cog = { path = "../adapters/swath-source-cog", version = "0.1.0-alpha.1" }
swath-source-virtual = { path = "../adapters/swath-source-virtual", version = "0.1.0-alpha.1" }
thiserror = { workspace = true }
# The binary owns the runtime (ARCHITECTURE.md §11): multi-thread tokio,
# TCP listener, and the SIGINT/SIGTERM graceful-shutdown signals.
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Authoring an openEO process graph in the serve-time rehydration test.
serde_json = { workspace = true }
# Parallel-safe temp dirs for store roots, drop dirs, and manifest outputs.
swath-testsupport = { path = "../swath-testsupport", version = "0.1.0-alpha.1" }

[lints]
workspace = true

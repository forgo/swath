# SPDX headers: covered by REUSE.toml aggregate annotation for **/Cargo.toml.
[package]
name = "swath-planner"
description = "Cost-aware materialization planner: pure, explainable cache/overview/live decisions under an explicit per-layer budget, every candidate weighed and traced."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["planner", "cost-model", "raster", "tiles", "gis"]
categories = ["science::geo", "algorithms"]
# One of the five publishable crates (ADR 0016, #192; swath-udf-guest joined
# in #209, ADR 0020); the actual
# `cargo publish` is maintainer-executed per docs/RELEASING.md's crates tier.
publish = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "planner"
harness = false

[lints]
workspace = true

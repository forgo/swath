description = "GDAL-exact warp/resample kernel in pure Rust: inverse-mapping nearest and bilinear resampling with GDAL 3.12 GDALWarpKernel semantics — scaled triangle filters under decimation, per-axis scale snapping, GDAL's exact validity cutoffs — proven against GDAL-oracle goldens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Stays false until the M8.8 publish pipeline (#192) adds the crates tier

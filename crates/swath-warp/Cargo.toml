# SPDX headers: covered by REUSE.toml aggregate annotation for **/Cargo.toml.
[package]
name = "swath-warp"
description = "GDAL-exact warp/resample kernel in pure Rust: inverse-mapping nearest and bilinear resampling with GDAL 3.12 GDALWarpKernel semantics — scaled triangle filters under decimation, per-axis scale snapping, GDAL's exact validity cutoffs — proven against GDAL-oracle goldens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["gdal", "warp", "resampling", "raster", "gis"]
categories = ["science::geo", "algorithms"]
# One of the five publishable crates (ADR 0016, #192; swath-udf-guest joined
# in #209); the actual
# `cargo publish` is maintainer-executed per docs/RELEASING.md's crates tier.
publish = true

[package.metadata.docs.rs]
all-features = true

# Self-contained by decision (ADR 0016's standalone rule): zero dependencies —
# the kernel takes its own minimal input types, never swath-core's.
[dependencies]

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

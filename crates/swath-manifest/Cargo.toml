[package]
name = "swath-manifest"
description = "Virtual-reference manifest v1: the versioned, deny-unknown JSON contract describing a legacy granule (HDF5/NetCDF4, GRIB2) as byte-range references into the original file, with the generator-equivalence check."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["kerchunk", "virtualizarr", "zarr", "hdf5", "grib2"]
categories = ["science::geo", "encoding"]
# One of the five publishable crates (ADR 0016, #192; swath-udf-guest joined
# in #209); the actual
# `cargo publish` is maintainer-executed per docs/RELEASING.md's crates tier.
publish = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
# The schema is serde all the way down; serde_json is the document format
# (pretty text out, validated text in). Exactly the published-dep set the
# extraction boundary records (docs/design/extraction-boundary.md §1) —
# extraction added zero dependencies (ADR 0016).
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The schema snapshot test (tests/manifest_schema.rs) travels with the crate.
insta = { workspace = true }

[lints]
workspace = true

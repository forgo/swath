[package]
name = "swath-modulestore-objectstore"
description = "ModuleStore + ModuleFetcher adapters for run_udf (ADR 0018): content-addressed WASM module bytes over object_store (local fs, in-memory, S3), and the once-per-publish http(s) fetch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The same storage abstraction the tile cache and pyramids use; `http`
# adds the generic HTTP(S) reader for the publish-time module fetch — the
# feature's crates (reqwest/rustls) are already in the tree under the
# binary's `aws` feature, so no new supply-chain surface.
object_store = { workspace = true, features = ["http"] }
swath-core = { path = "../../swath-core", version = "0.1.0-alpha.1" }
# Splitting an http(s) URL into store base + object path (object_store's
# `parse_url` takes a parsed `Url`); already a direct workspace dep.
url = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true

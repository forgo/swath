SPDX-License-Identifier: Apache-2.0

Wedge/thesis diagram, candidate B: "the single-system frontier" (plan
decision #3, issue #114). Axes are ordinal (mapped from the capability
ladders defined in docs/media/wedge.notes.md); the dashed curve marks what
any ONE deployed system offers today, per each project's own documentation.
Every placement is defended with citations in the notes sidecar. Opaque
light background so it renders identically on GitHub light and dark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 648" width="960" height="648"
     font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="648" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2328">The missing product layer &#8212; beyond the single-system frontier</text>
  <text x="480" y="56" text-anchor="middle" font-size="12.5" fill="#57606a">The primitives are mature; no one system fuses them into a managed, low-latency, observable loop &#183; placements cited in docs/media/wedge.notes.md</text>

  <!-- ============ the gap beyond the frontier ============ -->
  <path d="M 150 140 C 400 195, 660 275, 890 405 L 890 88 L 150 88 Z" fill="#ddf4ff" opacity="0.6"/>
  <path d="M 150 140 C 400 195, 660 275, 890 405" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="484" y="254" font-size="11" fill="#57606a">the single-system frontier today</text>

  <text x="470" y="108" text-anchor="middle" font-size="12" font-style="italic" fill="#0969da">reachable today only by hand-wiring</text>
  <text x="470" y="124" text-anchor="middle" font-size="12" font-style="italic" fill="#0969da">several projects per deployment</text>

  <!-- ============ axes ============ -->
  <line x1="120" y1="508" x2="920" y2="508" stroke="#57606a" stroke-width="1.5" marker-end="url(#axisArrow)"/>
  <line x1="120" y1="508" x2="120" y2="88" stroke="#57606a" stroke-width="1.5" marker-end="url(#axisArrow)"/>
  <text x="520" y="542" text-anchor="middle" font-weight="600" fill="#1f2328">arbitrary derived products through the public API &#8594;</text>
  <text x="96" y="298" transform="rotate(-90 96 298)" text-anchor="middle" font-weight="600" fill="#1f2328">low-latency dynamic tile serving &#8594;</text>

  <!-- ============ single-system placements (on the frontier) ============ -->

  <!-- xpublish-tiles -->
  <circle cx="205" cy="152" r="7" fill="#6e7781"/>
  <text x="205" y="180" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">xpublish-tiles</text>
  <text x="205" y="196" text-anchor="middle" font-size="10.5" fill="#57606a">dynamic OGC Tiles &amp; WMS from Xarray;</text>
  <text x="205" y="209" text-anchor="middle" font-size="10.5" fill="#57606a">renders &amp; styles existing variables</text>

  <!-- TiTiler -->
  <circle cx="350" cy="190" r="7" fill="#6e7781"/>
  <text x="350" y="218" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">TiTiler</text>
  <text x="350" y="234" text-anchor="middle" font-size="10.5" fill="#57606a">dynamic tile server; expressions +</text>
  <text x="350" y="247" text-anchor="middle" font-size="10.5" fill="#57606a">algorithms registered at deploy time</text>

  <!-- openEO backends: services point on the frontier, batch point below -->
  <line x1="858" y1="397" x2="858" y2="463" stroke="#6e7781" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="858" cy="390" r="7" fill="#ffffff" stroke="#6e7781" stroke-width="2"/>
  <circle cx="858" cy="470" r="7" fill="#6e7781"/>
  <text x="840" y="380" text-anchor="end" font-size="12.5" font-weight="600" fill="#1f2328">openEO backends</text>
  <text x="840" y="396" text-anchor="end" font-size="10.5" fill="#57606a">&#9675; XYZ/WMS secondary services, on demand,</text>
  <text x="840" y="409" text-anchor="end" font-size="10.5" fill="#57606a">where a backend implements them</text>
  <text x="840" y="474" text-anchor="end" font-size="10.5" fill="#57606a">&#9679; batch-first: arbitrary graphs + UDFs as jobs</text>

  <!-- ============ Swath, beyond the frontier ============ -->
  <path d="M 858 138 L 870 150 L 858 162 L 846 150 Z" fill="#0969da"/>
  <text x="858" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#0969da">Swath</text>

  <g font-size="11" fill="#1f2328">
    <text x="565" y="185">&#8226; openEO graph in &#8594; live XYZ out, byte-identical to the built-in NDVI</text>
    <text x="565" y="202">&#8226; run_udf: user WASM on the live tile path, fuel-metered, refused safely</text>
    <text x="565" y="219">&#8226; hot-tile p50 23.5 ms at 1,278 req/s; every tile&#8217;s decision traced</text>
    <text x="565" y="236">&#8226; north-star metric: ingest-to-pixel latency, measured end to end</text>
  </g>

  <!-- ============ footnotes ============ -->
  <text x="120" y="586" font-size="11" fill="#57606a">Axes are ordinal &#8212; positions map from the capability ladders in docs/media/wedge.notes.md (coordinated with the COMPARISON matrix definitions); no</text>
  <text x="120" y="602" font-size="11" fill="#57606a">metric scale is implied. Competitors are placed at the highest capability their own documentation claims; Swath&#8217;s receipts are committed artifacts.</text>
  <text x="120" y="618" font-size="11" fill="#57606a">Honesty note: openEO&#8217;s UDF story (Python, jobs, user-defined processes) exceeds Swath&#8217;s pixel-stage WASM run_udf &#8212; the claim is the fused live loop, not breadth.</text>
</svg>

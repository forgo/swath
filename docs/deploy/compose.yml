# Read-only public demo recipe (issue #212, ROADMAP.md §3 item 8) —
# provider-agnostic: any host with Docker Compose, a DNS name, and ports
# 80/443 reachable. Traefik terminates TLS (ACME, TLS-ALPN challenge),
# rate-limits per source IP, and is the ONLY published port; the swath
# container serves `--read-only` (#249: write routes absent, not 403'd —
# `POST /result` preview stays, behind its own tighter limits in
# traefik/dynamic.yml). Bring-up is two phases, both in docs/deploy/README.md:
#
#   1. seed  — `docker compose --profile seed run --rm seed`: a WRITABLE
#              swath (never published) ingests the fire-season fixtures
#              carried in the image and publishes the reference NDVI UDF
#              service; both persist (pgstac + the module store volume).
#   2. serve — `docker compose up -d`: the read-only swath restores the
#              persisted service at startup; Traefik fronts it.
#
# Required environment (a `.env` beside this file works): SWATH_DOMAIN,
# ACME_EMAIL, SWATH_PG_PASSWORD. Optional: SWATH_IMAGE (default the GHCR
# `latest` the README's one-liner runs), HTTP_PORT/HTTPS_PORT (default
# 80/443), ACME_CASERVER (Let's Encrypt production by default; point it at
# the staging directory while rehearsing so failed validations never touch
# production rate limits).

name: swath-demo

services:
  traefik:
    image: traefik:v3.7.11@sha256:5203c3f39ca70de6790d964624e042463ffbd57715bc82be155cf224c0dd5144
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.caserver=${ACME_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --api.dashboard=false
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # Read by the file provider's Go template (Host rule in dynamic.yml).
      SWATH_DOMAIN: ${SWATH_DOMAIN:?set SWATH_DOMAIN}
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    depends_on:
      swath:
        condition: service_healthy
    restart: unless-stopped

  # The published instance: read-only, no host port — reachable only
  # through Traefik. Data plane and module store mounted read-only (the
  # instance only ever reads them; a preview persists nothing — #206);
  # the tile cache is the one thing it writes.
  swath:
    image: ${SWATH_IMAGE:-ghcr.io/forgo/swath:latest}
    command: ["serve", "--config", "/app/config/swath.toml", "--read-only"]
    environment:
      SWATH_BASE_URL: https://${SWATH_DOMAIN:?set SWATH_DOMAIN}
      SWATH_CATALOG: postgres://swath:${SWATH_PG_PASSWORD:?set SWATH_PG_PASSWORD}@pgstac:5432/swath
    volumes:
      - ./swath.toml:/app/config/swath.toml:ro
      - store:/data:ro
      - cache:/cache
      - udf:/udf:ro
    depends_on:
      pgstac:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Seed phase only: the same image and config, WRITABLE, never published
  # (no ports; the internal network only). Its `POST /services` is what
  # persists the UDF service the read-only instance restores.
  swath-seed:
    profiles: [seed]
    image: ${SWATH_IMAGE:-ghcr.io/forgo/swath:latest}
    command: ["serve", "--config", "/app/config/swath.toml"]
    environment:
      SWATH_CATALOG: postgres://swath:${SWATH_PG_PASSWORD:?set SWATH_PG_PASSWORD}@pgstac:5432/swath
    volumes:
      - ./swath.toml:/app/config/swath.toml:ro
      - store:/data
      - cache:/cache
      - udf:/udf
    depends_on:
      pgstac:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The seeder: root only to hand the fresh volumes to the unprivileged
  # uid the swath image runs as (65534), then the drop + publish motion
  # of seed.sh against swath-seed. The fixtures come from the image
  # itself (/app/tests/fixtures); the reference NDVI UDF module comes from
  # the checkout (the committed, reproducibly built fixture — #202).
  seed:
    profiles: [seed]
    image: ${SWATH_IMAGE:-ghcr.io/forgo/swath:latest}
    user: "0:0"
    entrypoint: ["/bin/sh", "/seed/seed.sh"]
    environment:
      SWATH_SEED_BASE: http://swath-seed:8080
    volumes:
      - ./seed.sh:/seed/seed.sh:ro
      - ../../crates/adapters/swath-udf-wasmtime/tests/fixtures/ndvi.wasm:/seed/ndvi.wasm:ro
      - store:/data
      - cache:/cache
      - udf:/udf
    depends_on:
      swath-seed:
        condition: service_healthy

  pgstac:
    image: ghcr.io/stac-utils/pgstac:v0.9.10
    environment:
      POSTGRES_USER: swath
      POSTGRES_PASSWORD: ${SWATH_PG_PASSWORD:?set SWATH_PG_PASSWORD}
      POSTGRES_DB: swath
      PGUSER: swath
      PGDATABASE: swath
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swath -d swath"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  store:
  cache:
  udf:
  pgdata:
  letsencrypt:

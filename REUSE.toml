# REUSE 3.3 (ENGINEERING.md §8, issue #14). Source files carry real SPDX
# headers; docs, configs, and dated prototype records are annotated here in
# bulk. `just reuse` / the CI job keep the boundary machine-checkable.
version = 1
SPDX-PackageName = "swath"
SPDX-PackageDownloadLocation = "https://github.com/forgo/swath"

[[annotations]]
path = [
    "docs/**",
    "prototypes/**",
    "**/*.md",
    "*.md",
    "NOTICE",
    ".gitignore",
    "**/.gitignore",
    ".dockerignore",
    ".pre-commit-config.yaml",
    "docker-compose.yml",
    "codecov.yml",
    "web/*.json",
    "web/src/tms_truth.json",
    "web/pnpm-lock.yaml",
    "python/**/pyproject.toml",
    "python/pyproject.toml",
    "python/uv.lock",
    "python/.python-version",
    "python/**/py.typed",
    "justfile",
    "**/justfile",
    "renovate.json",
    "deny.toml",
    "Cargo.toml",
    "Cargo.lock",
    "**/Cargo.toml",
    "**/Cargo.lock",
    "examples/udf/tinygo/go.mod",
    "crates/adapters/swath-udf-wasmtime/tests/fixtures/*.wasm",
    "rust-toolchain.toml",
    "release-plz.toml",
    "cliff.toml",
    "dist-workspace.toml",
    "REUSE.toml",
    ".claude/settings.json",
    ".config/nextest.toml",
    ".github/**",
    "crates/swath-core/tests/data/*.json",
    "crates/swath-referencer/tests/data/tiny.h5",
    "crates/swath-referencer/tests/data/tiny.expected.json",
    "crates/swath-core/tests/snapshots/*.snap",
    "crates/swath-manifest/tests/snapshots/*.snap",
    "crates/swath-api/tests/snapshots/*.snap",
    "crates/swath-core/tests/*.proptest-regressions",
    "crates/adapters/swath-reproject-proj4rs/tests/data/*.json",
    "crates/adapters/swath-source-cog/tests/data/*.json",
    "crates/adapters/swath-source-virtual/tests/data/*.json",
    "crates/swath-render/tests/data/*.png",
    "crates/swath-render/tests/data/openeo/graphs/*.json",
    "crates/swath-render/tests/snapshots/*.snap",
    "tests/fixtures/*.tif",
    "tests/fixtures/*.png",
    "tests/fixtures/SHA256SUMS",
    "tests/fixtures/manifest.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Elliott Richerson <elliott.richerson@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# Official OGC JSON schemas committed as conformance-test data (provenance:
# crates/swath-api/tests/data/ogc/README.md). OGC's copyright and license,
# not ours — committed byte-identical to schemas.opengis.net.
[[annotations]]
path = ["crates/swath-api/tests/data/ogc/**/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Open Geospatial Consortium"
SPDX-License-Identifier = "OGC-1.0"

# Official openEO process definitions committed as conformance-test data
# (provenance: crates/swath-render/tests/data/openeo/README.md) and as the
# runtime documents `GET /processes` serves (byte-identical copies,
# provenance: crates/swath-api/data/openeo-processes/README.md). The openEO
# project's copyright and license, not ours — committed byte-identical to
# openeo-processes 1.2.0. (Authored graphs live in openeo/graphs/, ours.)
[[annotations]]
path = [
    "crates/swath-render/tests/data/openeo/*.json",
    "crates/swath-api/data/openeo-processes/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "openEO consortium contributors"
SPDX-License-Identifier = "Apache-2.0"

# openEO API 1.2.0 spec files committed as conformance-test data (provenance:
# crates/swath-api/tests/data/openeo/README.md): errors.json byte-identical,
# openapi.json a documented mechanical YAML->JSON rendering of the official
# openapi.yaml. The openEO project's copyright and license, not ours.
[[annotations]]
path = ["crates/swath-api/tests/data/openeo/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "openEO consortium contributors"
SPDX-License-Identifier = "Apache-2.0"

# Vendored matplotlib 3.10.3 colormap byte LUTs (provenance + regeneration:
# crates/swath-render/src/colormaps/README.md). viridis/magma color data are
# CC0-1.0 (Smith & van der Walt, github.com/BIDS/colormap); RdYlGn is a
# ColorBrewer palette, Apache-2.0 (Brewer, Harrower, Penn State).
[[annotations]]
path = ["crates/swath-render/src/colormaps/luts.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2002 Cynthia Brewer, Mark Harrower, and The Pennsylvania State University",
    "Nathaniel J. Smith and Stefan van der Walt",
]
SPDX-License-Identifier = "Apache-2.0 AND CC0-1.0"

# Real VNP09GA StructMetadata.0 text, committed verbatim as parser test truth
# (extracted from LP DAAC granule VNP09GA.A2012019.h33v12.002.2023122182434.h5;
# NASA LP DAAC data carry no use restrictions). Same aggregate treatment as
# the HLS-derived fixtures in tests/fixtures/.
[[annotations]]
path = ["crates/swath-referencer/tests/data/structmetadata_vnp09ga.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Elliott Richerson <elliott.richerson@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

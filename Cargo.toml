# Swath workspace root. Standards: docs/ENGINEERING.md §2 (ADR 0007).
# Crates inherit shared metadata/lints via [workspace.package] / [workspace.lints];
# per-crate Cargo.toml stays boilerplate-free.

[workspace]
resolver = "3"
members = [
    "crates/adapters/swath-cache-objectstore",
    "crates/adapters/swath-catalog-pgstac",
    "crates/adapters/swath-events-filedrop",
    "crates/adapters/swath-reproject-proj4rs",
    "crates/adapters/swath-source-cog",
    "crates/adapters/swath-source-virtual",
    "crates/swath-api",
    "crates/swath-cli",
    "crates/swath-core",
    "crates/swath-e2e",
    "crates/swath-referencer",
    "crates/swath-render",
    "crates/swath-testkit",
    "crates/swath-testsupport",
]
# Prototypes are standalone, dated experiments — never workspace members.
exclude = ["prototypes/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/forgo/swath"
authors = ["Elliott Richerson <elliott.richerson@gmail.com>"]

# Shared dependency versions live here as crates adopt them (`dep = { workspace = true }`).
[workspace.dependencies]
# PNG decode/encode only — the perceptual-diff oracle (issue #19) and, later,
# the tile encoder. Default features off: every extra codec is supply-chain
# surface the license gate (deny.toml) must then carry.
image = { version = "0.25.8", default-features = false, features = ["png"] }
# Trace model serialization (ARCHITECTURE.md §9): the SSE stream and the test
# suite both consume the same JSON shape.
serde = { version = "1.0.228", features = ["derive"] }
# float_roundtrip: the catalog's lossless STAC round trip (issue #30) is a
# contract on exact f64 identity through JSON text; serde_json's default float
# parser is the fast path that can be off by 1 ulp.
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
# Error taxonomy derive (ENGINEERING.md adopt list).
thiserror = { version = "2.0.17" }
# Property tests (ENGINEERING.md §2 testing stack). Dev-dependency only.
proptest = { version = "1.8.0" }
# Snapshot tests (ENGINEERING.md §2 testing stack): pins the Render IR's
# serde JSON shape and small eval outputs. Dev-dependency only.
insta = { version = "1.48.0", features = ["json"] }
# Microbenchmarks (issue #37: `plan()` must be trivially cheap and stay
# that way; issue #100: the render-stage suites). Dev-dependency only;
# default features off — no plotters/rayon report machinery, just the
# harness (every extra crate is deny surface). `async_tokio` lets the
# full-tile composite bench await the real `render_tile` future (#100).
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support", "async_tokio"] }
# COG/TIFF reading is ADOPT (ARCHITECTURE.md §3): async-tiff (developmentseed)
# parses headers/IFDs/GeoKeys and decodes tiles; default features off — we
# drive it through our own object_store-backed reader (no reqwest, and no
# coupling to the object_store version async-tiff's optional feature pins).
async-tiff = { version = "0.3.0", default-features = false }
# The one storage abstraction (ARCHITECTURE.md §3/§7): local fs + in-memory
# today, S3/MinIO later behind the same trait.
object_store = { version = "0.14.1" }
# async-tiff's AsyncFileReader trait is an #[async_trait] trait; implementing
# it (the provenance-recording reader) requires the same macro.
async-trait = { version = "0.1.89" }
bytes = { version = "1.10.1" }
# Adapter/test async runtime. NEVER a dependency of swath-core.
tokio = { version = "1.49.0", default-features = false }
# Postgres driver for the pgstac catalog adapter (#30). sqlx over
# tokio-postgres: the pooled, typed-bind, one-crate surface (PgPool + jsonb
# binds via the json feature) versus hand-rolling pooling/TLS/typed binds on
# tokio-postgres + deadpool — two more deps for less. Feature-trimmed hard:
# postgres + runtime-tokio + json only; no TLS backend compiled (local/dev
# and in-cluster plaintext for now — a tls-* feature is a deliberate later
# addition), no macros/migrate/derive (queries here are three static SQL
# strings calling pgstac functions; compile-time checking would drag a
# DATABASE_URL into every build).
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "json"] }
# Was dev-only (truth-table pixel hashes); promoted to a runtime dep of
# swath-core by the TileCache key (#36): the cache key must be stable
# across Rust releases and architectures (it names objects in a store), so
# it is SHA-256, never `DefaultHasher`. Pure computation — no I/O, keeps
# the core runtime-free. Already licensed/vetted in the tree (MIT/Apache).
sha2 = { version = "0.10.9" }
# Projection math is BIND, never build (ADR 0002): pure-Rust proj4 for the
# common CRS set; PROJ C-bindings feature-gated later for the long tail.
# Default features off: they only add binaries and multi-thread NAD-grid
# machinery the adapter doesn't use.
proj4rs = { version = "0.1.10", default-features = false }
# Inbound HTTP (ARCHITECTURE.md §11: tokio + axum). Default features off:
# the API crate builds Routers and serializes JSON — the server wiring
# (http1/tokio features) arrives with the binary (#29) and pays for itself
# then, not before.
axum = { version = "0.8.9", default-features = false, features = ["json"] }
# The `Stream` trait alone (trait-only crate, already in axum's own graph):
# implementing the stream axum's `Sse` consumes requires naming the trait.
# Never futures-util — the combinator surface stays out of the tree.
futures-core = { version = "0.3.31", default-features = false, features = ["alloc"] }
# OGC conformance smoke tests (REQUIREMENTS.md R5): responses are validated
# against the committed official OGC schemas. Dev-dependency only.
jsonschema = { version = "0.49.8", default-features = false }
# tower's ServiceExt::oneshot drives the Router in-process in tests — no
# real network. Dev-dependency only.
tower = { version = "0.5.3", default-features = false, features = ["util"] }
# Collecting response bodies in tests (axum's body is a Stream).
http-body-util = { version = "0.1.4" }
# CLI parsing for the `swath` binary (#29). `derive` for the declarative
# command tree; `env` so flags document and read their SWATH_* variables in
# one place (--help shows them). Config layering stays hand-rolled on top
# (clap + toml + serde — figment rejected: three deps do the job and every
# extra crate is deny surface).
clap = { version = "4.5.48", features = ["derive", "env"] }
# The config-file half of the layered config (defaults -> TOML -> env/flags).
toml = { version = "0.9.5" }
# Structured logging for the binary (the workspace lint already bans println
# in favor of tracing); compact single-line output, no ansi/env-filter
# features — level selection is a hand-parsed SWATH_LOG, not a regex DSL.
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt"] }

# Chunk decompression for the virtual-reference source (#39): HDF5's
# deflate filter is a zlib stream; flate2 (rust_backend — the same
# miniz_oxide already in the tree under png/async-tiff) inflates it. No new
# supply-chain surface: flate2 1.x was already a vetted transitive dep.
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
# The production referencer (ADR 0006, issue #40). gribberish: GRIB2 section
# metadata (offsets/lengths/grids/packing templates) — referencing needs no
# field decode, so default features stay off. hdf5-metno `static`: builds the
# bundled libhdf5 from source, so no system HDF5 is required on any platform
# (the single-binary story, prototype 0001 H4); versions pinned to the ones
# the bake-off validated.
gribberish = { version = "1.6.0", default-features = false }
hdf5-metno = { version = "0.14.0", features = ["static"] }

[workspace.lints.rust]
unsafe_code = "warn"       # visible and justified; scopes Miri to unsafe-bearing crates
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
# Pedantic-with-allows (uv-style). The allow-list below is grown honestly: an
# entry is added only when a lint produces a real false positive here, with the
# reasoning kept in this file. Never enable `restriction` or `nursery` wholesale.
pedantic = { level = "warn", priority = -1 }
# -- pedantic allows: documented false-positive patterns --
module_name_repetitions = "allow" # port/adapter naming (e.g. catalog::CatalogError) is deliberate
missing_errors_doc = "allow"      # error semantics live on the error types, not every fn
missing_panics_doc = "allow"      # asserts on internal invariants; public APIs must not panic anyway
must_use_candidate = "allow"      # too noisy on builder-style domain types
# -- targeted restriction lints --
print_stdout = "warn"             # library/server code logs via tracing, never prints
print_stderr = "warn"
dbg_macro = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

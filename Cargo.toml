# Swath workspace root. Standards: docs/ENGINEERING.md §2 (ADR 0007).
# Crates inherit shared metadata/lints via [workspace.package] / [workspace.lints];
# per-crate Cargo.toml stays boilerplate-free.

[workspace]
resolver = "3"
members = [
    "crates/adapters/swath-store-objectstore",
    "crates/adapters/swath-catalog-pgstac",
    "crates/adapters/swath-events-filedrop",
    "crates/adapters/swath-pyramid-objectstore",
    "crates/adapters/swath-reproject-proj4rs",
    "crates/adapters/swath-source-cog",
    "crates/adapters/swath-icechunk",
    "crates/adapters/swath-source-virtual",
    "crates/adapters/swath-udf-wasmtime",
    "crates/swath-api",
    "crates/swath-cli",
    "crates/swath-core",
    "crates/swath-e2e",
    "crates/swath-manifest",
    "crates/swath-planner",
    "crates/swath-referencer",
    "crates/swath-render",
    "crates/swath-testsupport",
    "crates/swath-udf-guest",
    "tools/docs-check",
    "crates/swath-warp",
]
# Prototypes are standalone, dated experiments — never workspace members.
# examples/udf is its own tiny workspace: wasm32-unknown-unknown cdylib
# modules (no_std, panic=abort) that host-side workspace builds must not
# try to compile, test, or link.
exclude = ["prototypes/*", "examples/udf/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/forgo/swath"
authors = ["Elliott Richerson <elliott.richerson@gmail.com>"]

# Shared dependency versions live here as crates adopt them (`dep = { workspace = true }`).
[workspace.dependencies]
# PNG only — the pdiff oracle and the tile encoder; every extra codec is deny surface.
image = { version = "0.25.8", default-features = false, features = ["png"] }
# Trace model serialization (ARCHITECTURE.md §9): the SSE stream and the test
# suite both consume the same JSON shape.
serde = { version = "1.0.228", features = ["derive"] }
# `float_roundtrip`: the catalog's lossless STAC round trip needs exact f64 identity.
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
# Error taxonomy derive (ENGINEERING.md adopt list).
thiserror = { version = "2.0.17" }
# Property tests (ENGINEERING.md §2 testing stack). Dev-dependency only.
proptest = { version = "1.8.0" }
# Snapshot tests (ENGINEERING.md §2 testing stack): pins the Render IR's
# serde JSON shape and small eval outputs. Dev-dependency only.
insta = { version = "1.48.0", features = ["json"] }
# Microbenchmarks (dev-only); default features off, `async_tokio` for the full-tile bench.
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support", "async_tokio"] }
# COG/TIFF, adopted (ARCHITECTURE.md §3); default features off — driven through our own reader.
async-tiff = { version = "0.3.0", default-features = false }
# The one storage abstraction (ARCHITECTURE.md §3/§7): local fs + in-memory
# today, S3/MinIO later behind the same trait.
object_store = { version = "0.14.1" }
# async-tiff's AsyncFileReader trait is an #[async_trait] trait; implementing
# it (the provenance-recording reader) requires the same macro.
async-trait = { version = "0.1.89" }
bytes = { version = "1.10.1" }
# Adapter/test async runtime. NEVER a dependency of swath-core.
tokio = { version = "1.49.0", default-features = false }
# Postgres for pgstac: `postgres` + `runtime-tokio` + `json` only (docs/SUPPLY-CHAIN.md).
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "json"] }
# The tile-cache key: SHA-256, stable across builds and platforms — never `DefaultHasher`.
sha2 = { version = "0.10.9" }
# `run_udf`'s inline `data:application/wasm;base64,…` form decodes in the compiler.
base64 = { version = "0.22.1" }
# Projection math is bind, never build (ADR 0002); default features off.
proj4rs = { version = "0.1.10", default-features = false }
# Inbound HTTP: the API crate builds routers; the binary adds `http1`/`tokio`.
axum = { version = "0.8.9", default-features = false, features = ["json"] }
# The `Stream` trait alone, for the SSE stream — never futures-util.
futures-core = { version = "0.3.31", default-features = false, features = ["alloc"] }
# OGC conformance smoke tests (REQUIREMENTS.md R5): responses are validated
# against the committed official OGC schemas. Dev-dependency only.
jsonschema = { version = "0.49.8", default-features = false }
# tower's ServiceExt::oneshot drives the Router in-process in tests — no
# real network. Dev-dependency only.
tower = { version = "0.5.3", default-features = false, features = ["util"] }
# Exactly `cors` (ADR 0011); nothing else from the middleware grab bag.
tower-http = { version = "0.6.11", default-features = false }
# The embedded UI bundle (ADR 0011), feature-gated in swath-cli.
include_dir = { version = "0.7.4" }
# Collecting response bodies in tests (axum's body is a Stream).
http-body-util = { version = "0.1.4" }
# `derive` + `env`; config layering stays hand-rolled on clap + toml + serde.
clap = { version = "4.5.48", features = ["derive", "env"] }
# The config-file half of the layered config (defaults -> TOML -> env/flags).
toml = { version = "0.9.5" }
# Structured logging for the binary (the workspace lint already bans println
# in favor of tracing); compact single-line output, no ansi/env-filter
# features — level selection is a hand-parsed SWATH_LOG, not a regex DSL.
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt"] }

# Codec-chain decode for virtual references; feature-trimmed hard — docs/SUPPLY-CHAIN.md.
zarrs = { version = "0.23.13", default-features = false, features = ["zlib"] }
# The `run_udf` runtime (ADR 0018), trimmed to the ADR's commitments — docs/SUPPLY-CHAIN.md.
wasmtime = { version = "47.0.3", default-features = false, features = ["runtime", "cranelift", "pooling-allocator", "std"] }
# The manifest → Icechunk committer (spec v2.1), `object-store-fs` only — docs/SUPPLY-CHAIN.md.
icechunk = { version = "2.1.2", default-features = false, features = ["object-store-fs"] }
# Filesystem-path -> file:// URL construction for virtual chunk locations
# (percent-encoding done right); already in the tree transitively under
# icechunk — a direct use, not new supply-chain surface.
url = { version = "2.5.7" }
gribberish = { version = "1.6.0", default-features = false }
hdf5-metno = { version = "0.14.0", features = ["static"] }

[workspace.lints.rust]
unsafe_code = "warn"       # visible and justified; scopes Miri to unsafe-bearing crates
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
# Pedantic-with-allows (uv-style). The allow-list below is grown honestly: an
# entry is added only when a lint produces a real false positive here, with the
# reasoning kept in this file. Never enable `restriction` or `nursery` wholesale.
pedantic = { level = "warn", priority = -1 }
# -- pedantic allows: documented false-positive patterns --
module_name_repetitions = "allow" # port/adapter naming (e.g. catalog::CatalogError) is deliberate
missing_errors_doc = "allow"      # error semantics live on the error types, not every fn
missing_panics_doc = "allow"      # asserts on internal invariants; public APIs must not panic anyway
must_use_candidate = "allow"      # too noisy on builder-style domain types
# -- targeted restriction lints --
print_stdout = "warn"             # library/server code logs via tracing, never prints
print_stderr = "warn"
dbg_macro = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# The profile cargo-dist builds release artifacts with (release.yml,
# docs/RELEASING.md): identical to release today, kept separate so
# artifact-only tuning never changes what `cargo build --release` means.
[profile.dist]
inherits = "release"
lto = "thin"

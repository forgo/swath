# Swath local stack (ARCHITECTURE.md §15, issue #15): the ONLY required infra
# is Postgres+pgstac and an S3-compatible object store. The `swath` service
# joins this file once the binary exists (issue #29). `just e2e` is the smoke
# gate. Credentials here are local-dev-only values, never real secrets.

services:
  pgstac:
    image: ghcr.io/stac-utils/pgstac:v0.9.10
    environment:
      POSTGRES_USER: swath
      POSTGRES_PASSWORD: swath-local-dev
      POSTGRES_DB: swath
      PGUSER: swath
      PGDATABASE: swath
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swath -d swath"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: swath
      MINIO_ROOT_PASSWORD: swath-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

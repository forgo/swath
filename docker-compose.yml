# Swath local stack (ARCHITECTURE.md §15, issues #15/#29): the single `swath`
# binary plus the ONLY required infra — Postgres+pgstac and an S3-compatible
# object store. `just e2e` is the smoke gate. Credentials here are
# local-dev-only values, never real secrets.

services:
  # The single self-contained deployable (issue #29), in catalog mode
  # (issue #31): layers are defined over the hls-s30 dataset in the mounted
  # config, registered into pgstac at startup, and served from the dataset's
  # latest ingested granule. The filedrop watcher ingests any
  # `<granule-id>.json` manifest appearing under ./target/e2e/store/drop
  # (mounted at /data/drop) — drop a granule, watch it go live; `just e2e`
  # does exactly that and reads the ingest-to-pixel number off the Trace.
  # Honesty note: minio is topology (§15) — the store root here is the local
  # bind mount; pointing store-root at s3:// is exercised elsewhere.
  swath:
    build: .
    command:
      ["serve", "--config", "/app/config/swath.toml"]
    ports:
      - "8080:8080"
    volumes:
      - ./tests/e2e/swath-catalog.toml:/app/config/swath.toml:ro
      # Data plane: COG store at /data, drop directory at /data/drop.
      # Read-only — the server only ever reads; writers are outside.
      - ./target/e2e/store:/data:ro
    depends_on:
      pgstac:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
  pgstac:
    image: ghcr.io/stac-utils/pgstac:v0.9.10
    environment:
      POSTGRES_USER: swath
      POSTGRES_PASSWORD: swath-local-dev
      POSTGRES_DB: swath
      PGUSER: swath
      PGDATABASE: swath
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swath -d swath"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: swath
      MINIO_ROOT_PASSWORD: swath-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

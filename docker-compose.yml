# Swath local stack (ARCHITECTURE.md §15, issues #15/#29): the single `swath`
# binary plus the ONLY required infra — Postgres+pgstac and an S3-compatible
# object store. `just e2e` is the smoke gate. Credentials here are
# local-dev-only values, never real secrets.

services:
  # The single self-contained deployable (issue #29), in `--fixtures` demo
  # mode: serves the baked-in HLS fixture layers from the image, no external
  # data. Honesty note: `serve` does not consume pgstac or minio yet — the
  # catalog (#30) and S3-store (#31) wiring land next. The depends_on
  # healthy-gating exists to pin the §15 topology and prove startup ordering
  # against real dependencies from day one.
  swath:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      pgstac:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
  pgstac:
    image: ghcr.io/stac-utils/pgstac:v0.9.10
    environment:
      POSTGRES_USER: swath
      POSTGRES_PASSWORD: swath-local-dev
      POSTGRES_DB: swath
      PGUSER: swath
      PGDATABASE: swath
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swath -d swath"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: swath
      MINIO_ROOT_PASSWORD: swath-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
